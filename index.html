// PURE — customer search across name, address, postcode, phone and email (unit-tested).
// Spaces in the query are ignored for numbers/postcodes so "e17 9nl" and "07700900112" both hit.
function searchCustomers(list, q) {
  const raw = (q||'').trim().toLowerCase();
  if (!raw) return list||[];
  const terms = raw.split(/\s+/).filter(Boolean);
  const squashed = raw.replace(/\s/g,'');
  return (list||[]).filter(c=>{
    const hay = [c.title,c.first,c.last,c.addr,c.email,c.mob,c.mob2,c.standingNotes].filter(Boolean).join(' ').toLowerCase();
    const haySquashed = hay.replace(/\s/g,'');
    if (haySquashed.includes(squashed)) return true;      // postcodes & phone numbers
    return terms.every(t=>hay.includes(t));               // "grace myrtle" in any order
  });
}

function RouteMap({ jobs, drivers, filterDriver, customers, height='340px' }) {
  const elRef = useRef(null), mapRef = useRef(null), layerRef = useRef(null);

  useEffect(()=>{

    const map = L.map(elRef.current, { scrollWheelZoom:false }).setView([51.60,-0.01], 12);
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',
      { maxZoom:19, attribution:'&copy; OpenStreetMap contributors' }).addTo(map);
    mapRef.current = map;
    layerRef.current = L.layerGroup().addTo(map);
    return ()=>{ map.remove(); mapRef.current=null; layerRef.current=null; };
  },[]);

  useEffect(()=>{
    const map = mapRef.current, group = layerRef.current;
    if (!map || !group) return;
    group.clearLayers();
    const bounds = [[SHOP.lat,SHOP.lng]];
    const initials = n => (n||'').split(' ').filter(Boolean).map(w=>w[0]).join('').slice(0,2).toUpperCase();
    const shopIcon = L.divIcon({ className:'', iconSize:[30,30], iconAnchor:[15,15],
      html:`<div style="background:#1f2a30;width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.35)">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11l8-6 8 6"/><path d="M6 10v9h12v-9"/></svg></div>` });
    // stop pin: driver initials + driving order (e.g. "SO | 1")
    const stopIcon = (ini, seq, bg) => L.divIcon({ className:'', iconSize:[42,24], iconAnchor:[21,12],
      html:`<div style="background:${bg};color:#fff;height:24px;padding:0 7px;border-radius:12px;display:inline-flex;align-items:center;gap:3px;font:bold 11px Inter,Arial;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.35);white-space:nowrap">
        <span>${ini}</span><span style="opacity:.5">|</span><span>${seq}</span></div>` });

    L.marker([SHOP.lat,SHOP.lng],{icon:shopIcon})
      .bindPopup(`<b>${SHOP.name}</b><br>${SHOP.addr}<br><i>Start &amp; end of the round</i>`).addTo(group);

    drivers.forEach((d,di)=>{
      if (filterDriver!=='all' && filterDriver!==d.id) return;
      const ini = initials(d.name);
      const list = jobs.filter(j=>j.driverId===d.id).sort((a,b)=>a.seq-b.seq);
      const pts = [[SHOP.lat,SHOP.lng]];
      list.forEach(j=>{
        const c = custById(j.customerId);
        if (!c || c.lat==null) return;
        const resolved = j.status!=='pending';
        const bg = resolved ? '#9aa5ab' : (j.type==='collection' ? '#f43f5e' : '#3AAFCB');
        L.marker([c.lat,c.lng],{icon:stopIcon(ini, j.seq, bg)}).bindPopup(
          `<b>${fullName(c)}</b><br>${c.addr}<br>${j.type==='collection'?'Collection':'Delivery'} · ${j.window}` +
          `<br><i>${d.name}${resolved?' · done':''}</i>`).addTo(group);
        pts.push([c.lat,c.lng]); bounds.push([c.lat,c.lng]);
      });
      pts.push([SHOP.lat,SHOP.lng]);
      if (pts.length>2){
        const colour = di===0?'#2b93ac':'#7c3aed';
        // straight lines first so the map is never empty, then swap in the real
        // roads once Mapbox answers (if it's configured and reachable)

        if (hasMapbox()){

            if(group.hasLayer(guess)) group.removeLayer(guess);

}

function Logistics({ jobs, setJobs, drivers, onNew, deleteJob, customers, user }) {
  const driverStaff = drivers.filter(d=>hasRole(d,'driver'));

      if(d>TODAY && d!==day) m[d]=(m[d]||0)+1; });   // past days are in the missed banner
    return Object.entries(m).sort((a,b)=>a[0].localeCompare(b[0])).slice(0,6);

  const [optimising,setOptimising]=useState(false);
  // Ask Mapbox for real driving distances between the shop and every stop, then
  // order the run on those. Falls back to straight lines if it can't — an

  const optimise = async () => {
    if(optimising) return;

      for(const did of targets){

          .sort((a,b)=>a.seq-b.seq)

          .filter(Boolean);

          }
        }
        beforeKm += routeLengthKm([depot,...beforeStops,depot], haversineKm);
        next = optimiseDriver(next, did, day, haversineKm);
        afterKm += routeLengthKm([depot,...stopsOf(next),depot], haversineKm);
      }
      setJobs(next);
      setSaving({ before: beforeKm*0.621371, after: afterKm*0.621371, roads: usedRoads, tooMany });
    } finally { setOptimising(false); }
  };
  const move=(driverId,jobId,dir)=>setJobs(prev=>moveJob(prev,driverId,jobId,dir,day));
  const reassign=(jobId,toDriverId)=>setJobs(prev=>moveJobTo(prev,jobId,toDriverId,null,day));
  const [showLoading,setShowLoading]=useState(false);
  const [foldedDrv,foldDrv]=useCollapsed('logistics-drivers');

  // Reordering by touch. The browser's built-in drag-and-drop is mouse-only,
  // which is why this never worked on a phone. Pointer events cover all three.
  const dragRef = useRef(null);
  const [draggingId,setDraggingId] = useState(null);
  const clearMarks = () => document.querySelectorAll('.drag-over').forEach(el=>el.classList.remove('drag-over'));

  const startDrag = (e, job, fromDriverId) => {
    if(e.pointerType==='mouse' && e.button!==0) return;
    e.preventDefault(); e.stopPropagation();
    const ghost=document.createElement('div');
    ghost.className='drag-ghost';
    ghost.textContent=fullName(custById(job.customerId));
    document.body.appendChild(ghost);
    document.body.classList.add('is-dragging');
    dragRef.current={ jobId:job.id, fromDriverId, ghost, x:e.clientX, y:e.clientY, overJob:null, overDriver:null };
    ghost.style.left=e.clientX+'px'; ghost.style.top=e.clientY+'px';
    setDraggingId(job.id);
  };

  useEffect(()=>{
    if(!draggingId) return;
    const D=()=>dragRef.current;

    const aim = (x,y) => {
      const el=document.elementFromPoint(x,y); if(!el) return;
      const card=el.closest('[data-job-id]'), col=el.closest('[data-driver-col]');
      clearMarks();
      const d=D(); if(!d) return;
      d.overJob = card && card.getAttribute('data-job-id')!==d.jobId ? card.getAttribute('data-job-id') : null;
      d.overDriver = col ? col.getAttribute('data-driver-col') : null;
      if(d.overJob) card.classList.add('drag-over');
      else if(col) col.classList.add('drag-over');
    };

    const move=(ev)=>{
      const d=D(); if(!d) return;
      ev.preventDefault();
      d.x=ev.clientX; d.y=ev.clientY;
      d.ghost.style.left=d.x+'px'; d.ghost.style.top=d.y+'px';
      aim(d.x,d.y);
    };

    // creep the page when the finger nears the top or bottom — essential with
    // a long run on a small screen
    const edge=setInterval(()=>{
      const d=D(); if(!d) return;
      const h=window.innerHeight;
      if(d.y<90) window.scrollBy(0,-14);
      else if(d.y>h-90) window.scrollBy(0,14);
      if(d.y<90||d.y>h-90) aim(d.x,d.y);
    },16);

    const finish=()=>{
      const d=D(); if(!d) return;
      if(d.ghost && d.ghost.parentNode) d.ghost.parentNode.removeChild(d.ghost);
      document.body.classList.remove('is-dragging');
      clearMarks();
      if(d.overJob){
        const target=jobs.find(j=>j.id===d.overJob);
        if(target) setJobs(prev=>moveJobTo(prev, d.jobId, target.driverId, target.id, day));
      } else if(d.overDriver && d.overDriver!==d.fromDriverId){
        setJobs(prev=>moveJobTo(prev, d.jobId, d.overDriver, null, day));
      }
      dragRef.current=null; setDraggingId(null);
    };

    window.addEventListener('pointermove',move,{passive:false});
    window.addEventListener('pointerup',finish);
    window.addEventListener('pointercancel',finish);
    return ()=>{ clearInterval(edge);
      window.removeEventListener('pointermove',move);
      window.removeEventListener('pointerup',finish);
      window.removeEventListener('pointercancel',finish); };
  },[draggingId,jobs,day]);
  const printLoading = () => {
    const blocks = driverStaff.map(d=>{ const L=loadingGroups(jobs,d.id,day);
      if(!L.total) return '';
      return `<h2>${d.name} — ${L.total} deliver${L.total===1?'y':'ies'} · ${L.bags} bag(s)</h2>` +
        L.groups.map(g=>`<h3>${g.packaging} — ${g.stops.length} stop(s), ${g.bags} bag(s)</h3>
          <table><tbody>${g.stops.map(st=>`<tr><td class="n">${st.seq}</td><td>${st.name}</td><td class="b">${st.bags} bag(s)</td></tr>`).join('')}</tbody></table>`).join('');
    }).join('');
    const html = `<html><head><title>NELIS — Van loading ${dayLabel(day)}</title>
      <style>body{font-family:Arial;padding:18px;color:#1f2a30}h1{font-size:17px;margin:0 0 2px}
      .sub{color:#777;font-size:12px;margin-bottom:14px}h2{font-size:14px;margin:16px 0 6px;border-bottom:2px solid #3AAFCB;padding-bottom:3px}
      h3{font-size:12px;margin:10px 0 3px;color:#6d28d9}table{width:100%;border-collapse:collapse;font-size:12px}
      td{border-bottom:1px solid #eee;padding:4px 6px}.n{width:32px;font-weight:bold;color:#3AAFCB}.b{text-align:right;color:#777;width:80px}</style></head>
      <body><h1>Van loading list</h1><div class="sub">${dayLabel(day)} · ${fmtDate(day)}</div>${blocks||'<p>No deliveries on this day.</p>'}</body></html>`;
    const w=window.open('','_blank'); if(!w){alert('Please allow pop-ups to print.');return;}
    w.document.write(html); w.document.close(); w.focus(); setTimeout(()=>w.print(),300);
  };
  return (
    <div>
      <div className="flex items-center justify-between mb-1 flex-wrap gap-2">
        <h3 className="font-bold text-ink">Logistics &amp; route planning</h3>
        <Btn kind="rose" icon="plus" onClick={onNew} className="!py-1.5 !px-3">New job</Btn>
      </div>
      <p className="text-xs text-slate2 mb-3">Each driver's collections + deliveries for the chosen day. <b>Drag the handle</b> to reorder, or drop a stop on the other driver to reassign — works on phone and computer. The arrows and the <b>Move to</b> menu do the same thing. <span className="text-rose-500 font-semibold">Pink = collection</span>, white = delivery.</p>
      <div className="mb-3"><DayPicker day={day} setDay={setDay} counts={dayCounts}/></div>
      <MissedBanner missed={missedAll} onGo={setDay}/>
      {otherDays.length>0 && <div className="mb-3 flex flex-wrap gap-1.5">
        <span className="text-[11px] text-slate2 self-center">Also booked ahead:</span>
        {otherDays.map(([d,n])=>(
          <button key={d} onClick={()=>setDay(d)} className="px-2.5 py-1 rounded-full text-[11px] font-semibold bg-teal-light text-teal-dark">
            {dayLabel(d)} · {n}</button>))}
      </div>}

      <div className="bg-white card rounded-2xl p-3 mb-4">
        <div className="flex items-center justify-between mb-2 flex-wrap gap-2">
          <h4 className="font-bold text-ink text-sm">{dayLabel(day)}’s stops on the map</h4>
          <div className="flex items-center gap-2 flex-wrap">
            <div className="flex items-center gap-1 bg-gray-50 rounded-xl p-1">
              {[['all','All drivers'],...driverStaff.map(d=>[d.id,d.name.split(' ')[0]])].map(([k,l])=>(
                <button key={k} onClick={()=>{setMapDriver(k);setSaving(null);}}
                  className={`px-2.5 py-1 rounded-lg text-xs font-semibold ${mapDriver===k?'bg-teal text-white':'text-slate2'}`}>{l}</button>))}
            </div>
            <Btn kind="primary" icon="pin" onClick={optimise} className="!py-1.5 !px-3 text-xs" {...(optimising?{disabled:true}:{})}>
              {optimising?'Working out the route…':'Suggest best order'}</Btn>
          </div>
        </div>
        <RouteMap jobs={dayJobs} drivers={driverStaff} filterDriver={mapDriver} customers={customers}/>
        <div className="flex items-center justify-between gap-3 flex-wrap mt-2">
          <p className="text-[11px] text-slate2 flex-1 min-w-[220px]">
            <span className="text-rose-500 font-semibold">Pink = collection</span>, <span className="text-teal-dark font-semibold">blue = delivery</span>,
            grey = already done. Each pin shows the driver’s initials and driving order (e.g. SO | 1); the house marker is the shop (start &amp; end). Tap a pin for details. The line follows the actual roads once a Mapbox key is set.</p>
          <span className="text-xs font-bold text-ink whitespace-nowrap" title={hasMapbox()?'Straight-line estimate; tap Suggest best order for real driving miles':'Straight-line estimate'}>Round: ~{roundMiles.toFixed(1)} miles</span>
        </div>
        {noLoc>0 && <div className="text-xs text-amber-600 mt-1 inline-flex items-center gap-1"><Ic name="info" size={13}/>{noLoc} stop{noLoc>1?'s':''} not on the map yet — finding location from the address…</div>}
        {saving && <div className="mt-2 space-y-1">
          <div className={`text-xs rounded-lg px-2.5 py-1.5 inline-flex items-center gap-1.5 ${saving.after < saving.before-0.05 ? 'bg-emerald-50 text-emerald-700':'bg-gray-50 text-slate2'}`}>
            <Ic name="check" size={14}/>{saving.after < saving.before-0.05
              ? `Reordered — about ${(saving.before-saving.after).toFixed(1)} miles shorter (${saving.before.toFixed(1)} → ${saving.after.toFixed(1)} miles).`
              : `Already in a good order — no shorter route found (${saving.before.toFixed(1)} miles).`}</div>
          <div className="text-[11px] text-slate2 inline-flex items-center gap-1">
            <Ic name="info" size={12}/>
            {saving.roads ? 'Ordered by real driving distance.'
              : saving.tooMany ? `More than ${MAPBOX_MAX_COORDS-1} stops on one run — ordered in straight lines instead.`
              : hasMapbox() ? 'Road distances unavailable just now — ordered in straight lines.'
              : 'Ordered in straight lines. Add a Mapbox key to use real driving distances.'}
          </div>
        </div>}
      </div>
      <div className="bg-white card rounded-2xl p-3 mb-4">
        <div className="flex items-center justify-between gap-2 flex-wrap">
          <button onClick={()=>setShowLoading(v=>!v)} className="font-bold text-ink text-sm inline-flex items-center gap-1.5">
            <Ic name="box" size={16}/>Van loading list
            <span className="text-slate2 font-normal text-xs inline-flex items-center gap-1">{showLoading?'Hide':'Show'}<Ic name={showLoading?'up':'down'} size={13}/></span>
          </button>
          {showLoading && <Btn kind="ghost" icon="printer" onClick={printLoading} className="!py-1 !px-2.5 text-xs">Print</Btn>}
        </div>
        {showLoading && <div className="mt-3 grid md:grid-cols-2 gap-4">
          {driverStaff.map(d=>{ const L=loadingGroups(jobs,d.id,day);
            return (
              <div key={d.id}>
                <h4 className="font-bold text-ink text-sm inline-flex items-center gap-1.5"><Ic name="truck" size={15}/>{d.name}
                  <span className="text-slate2 font-normal">· {L.total} deliver{L.total===1?'y':'ies'}{L.bags?` · ${L.bags} bag${L.bags===1?'':'s'}`:''}</span></h4>
                {L.total===0
                  ? <p className="text-sm text-slate2 mt-1">No deliveries on this day.</p>
                  : L.groups.map(g=>(
                      <div key={g.packaging} className="mt-2">
                        <div className={`text-[11px] font-bold uppercase tracking-wide ${g.packaging==='Not set yet'?'text-rose-600':'text-violet-700'}`}>
                          {g.packaging} · {g.stops.length} stop{g.stops.length===1?'':'s'}{g.bags?` · ${g.bags} bag${g.bags===1?'':'s'}`:''}</div>
                        <div className="mt-1 space-y-0.5">
                          {g.stops.map(st=>(
                            <div key={st.seq} className="flex items-center gap-2 text-sm">
                              <span className="w-6 h-6 rounded-full bg-teal text-white text-xs font-bold flex items-center justify-center shrink-0">{st.seq}</span>
                              <span className="text-ink truncate flex-1">{st.name}</span>
                              {st.bags>0 && <span className="text-slate2 text-xs shrink-0">{st.bags} bag{st.bags===1?'':'s'}</span>}
                            </div>))}
                        </div>
                      </div>))}
              </div>); })}
          <p className="text-[11px] text-slate2 md:col-span-2">Numbers are the driving order — load the last stop deepest in the van.</p>
        </div>}
      </div>
      <div className="grid md:grid-cols-2 gap-4">
        {driverStaff.map(d=>{
          const list=dayJobs.filter(j=>j.driverId===d.id).sort((a,b)=>a.seq-b.seq);
          const open = !foldedDrv.has(d.id);
          const doneN = list.filter(x=>x.status!=='pending').length;
          return (
            <div key={d.id} data-driver-col={d.id} className="bg-white card rounded-2xl p-4">
              <button onClick={()=>foldDrv(d.id)} className="w-full flex items-center gap-1.5 mb-2 text-left">
                <Ic name="truck" size={16}/>
                <h4 className="font-bold text-ink text-sm">{d.name}</h4>
                <span className="text-slate2 font-normal text-sm">· {list.length} stop{list.length===1?'':'s'}{doneN?` · ${doneN} done`:''}</span>
                <FoldToggle open={open} count={list.length}/>
              </button>
              {open && <>
              {(()=>{ const moved=list.filter(x=>x.reorderedBy);
                if(!moved.length) return null;
                const last=moved.reduce((a,b)=>(a.reorderedAt||'')>(b.reorderedAt||'')?a:b);
                return <div className="text-[11px] text-amber-700 bg-amber-50 border border-amber-100 rounded-lg px-2 py-1 mb-2 inline-flex items-center gap-1.5">
                  <Ic name="info" size={13}/>{last.reorderedBy} changed this run — {moved.length} stop{moved.length>1?'s':''} moved, last at {last.reorderedAt}</div>; })()}
              {list.length===0 ? <p className="text-sm text-slate2 border-2 border-dashed border-gray-200 rounded-xl p-4 text-center">No route assigned — drag a stop here to reassign it.</p> :
                <div className="space-y-2">
                  {list.map((j,idx)=>{ const c=custById(j.customerId); const done=j.status==='done', na=j.status==='no-answer', resolved=done||na;
                    return (
                      <div key={j.id} data-job-id={j.id}
                        className={`rounded-xl border px-2 py-2 ${draggingId===j.id?'dragging-now':''} ${resolved?'opacity-60 bg-gray-50 border-gray-100':j.type==='collection'?'bg-rose-50/70 border-rose-100':'bg-white border-gray-100'}`}>
                        <div className="flex items-center gap-2">
                          <span className="grip-handle text-gray-400 hover:text-slate2 -m-1 p-1 touch-none"
                            title="Drag to reorder" onPointerDown={e=>startDrag(e, j, d.id)}><Ic name="grip" size={18}/></span>
                          <span className={`w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold text-white shrink-0 ${resolved?'bg-gray-300':j.type==='collection'?'bg-rose-500':'bg-teal'}`}>{j.seq}</span>
                          <div className="flex-1 min-w-0">
                            <div className="flex items-center gap-1.5 flex-wrap"><TypeBadge type={j.type}/><span className="text-xs text-slate2">{j.window}</span>{done && <Badge tone="green">Done</Badge>}{na && <Badge tone="rose">No answer</Badge>}
                              {j.reorderedBy && <span title={`Moved by ${j.reorderedBy} at ${j.reorderedAt}`}><Badge tone="amber">Moved by driver</Badge></span>}</div>
                            <div className="text-sm text-ink truncate">{fullName(c)}</div>
                            <div className="text-xs text-slate2 truncate">{c.addr}</div>
                            {j.type==='delivery' && <div className="text-[11px] text-slate2 mt-0.5 flex flex-wrap items-center gap-x-2.5 gap-y-0.5">
                              <span className="inline-flex items-center gap-1 font-semibold text-teal-dark"><Ic name="box" size={12}/>{packLabel(j.packaging)}</span>
                              {j.bags!=null && <span>{j.bags} bag{j.bags===1?'':'s'}</span>}
                              {j.amount>0 && <span className="font-semibold text-ink">{gbp(j.amount)}</span>}
                              {j.paidInAdvance ? <Badge tone="green">Paid</Badge> : (j.paymentMethod && j.paymentMethod!=='—' && <span>{j.paymentMethod}</span>)}
                            </div>}
                            {c.standingNotes && <div className="mt-1"><StandingNote customer={c} size="xs"/></div>}
                          </div>
                          <div className="flex flex-col text-slate2">
                            <button onClick={()=>move(d.id,j.id,'up')} disabled={idx===0} className={idx===0?'text-gray-200':'hover:text-teal'}><Ic name="up" size={16}/></button>
                            <button onClick={()=>move(d.id,j.id,'down')} disabled={idx===list.length-1} className={idx===list.length-1?'text-gray-200':'hover:text-teal'}><Ic name="down" size={16}/></button>
                          </div>
                          {mayDelete(user) && <button onClick={()=>{ if(window.confirm(`Cancel this ${j.type} for ${fullName(c)}?`)) deleteJob(j); }}
                            className="text-gray-300 hover:text-rose-500 self-center" title="Cancel / delete this job"><Ic name="trash" size={16}/></button>}
                        </div>
                        {driverStaff.length>1 &&
                          <div className="flex items-center gap-1 mt-1.5 pl-8">
                            <span className="text-[11px] text-slate2">Move to:</span>
                            <select value={d.id} onChange={e=>reassign(j.id,e.target.value)} className="text-[11px] border border-gray-200 rounded-lg px-1 py-0.5 bg-white text-ink">
                              {driverStaff.map(dr=><option key={dr.id} value={dr.id}>{dr.name}</option>)}</select>
                          </div>}
                      </div>);
                  })}
                </div>}
              </>}
            </div>);
        })}
      </div>
    </div>
  );
}

/* =================================================================== */
/*  ROOT                                                              */
/* =================================================================== */
function LoadingScreen() {
  return <div className="min-h-screen flex flex-col items-center justify-center gap-4">
    <Logo h={54}/><div className="text-slate2 text-sm">Loading your data…</div>
    <div className="w-6 h-6 border-2 border-teal border-t-transparent rounded-full animate-spin"></div></div>;
}
function ErrorScreen({ msg }) {
  return <div className="min-h-screen flex items-center justify-center p-6">
    <div className="bg-white card rounded-2xl p-6 max-w-md text-center">
      <div className="w-12 h-12 mx-auto rounded-full bg-rose-50 text-rose-600 flex items-center justify-center"><Ic name="alert" size={24}/></div>
      <h2 className="font-bold text-ink mt-3">Couldn’t reach the database</h2>
      <p className="text-sm text-slate2 mt-2">{msg}</p>
      <p className="text-xs text-slate2 mt-3">Check the internet connection and that the Supabase project URL and key are correct, then reload.</p>
    </div></div>;
}

function App() {
  const [phase,setPhase]=useState(db ? 'loading' : 'ready'); // no db -> offline demo fallback
  const [err,setErr]=useState('');
  const [view,setView]=useState('picker');
  const [user,setUser]=useState(null);
  const userRef = useRef(null); userRef.current = user;
  const actor = () => (userRef.current && userRef.current.name) || 'Someone';
  const [jobs,setJobsState]=useState(INITIAL_JOBS);
  const [orders,setOrdersState]=useState(INITIAL_ORDERS);
  const [rates,setRatesState]=useState(INITIAL_RATES);
  const [drivers,setDriversState]=useState(DRIVERS);
  const [audit,setAudit]=useState([]);
  const [customers,setCustomersState]=useState(CUSTOMERS);
  const [saveError,setSaveError]=useState('');
  // land at the top on first paint and on every portal change
  useEffect(()=>{ window.scrollTo(0,0); },[view,phase]);

  // Pull everything the signed-in person is allowed to see. Runs once on start
  // (when only the staff list is readable) and again after sign-in, once the
  // session token lets the database release the rest.
  const reloadAll = useCallback(()=>{
    if(!db) return Promise.resolve();
    return loadAll().then(d=>{
        setCustomersState(d.customers); setDriversState(d.drivers); setJobsState(d.jobs);
        setOrdersState(d.orders); setRatesState(d.rates); setAudit(d.audit); setPhase('ready');
        const missing = d.customers.filter(c=>c.addr && c.lat==null);  // fill in map coordinates for any that lack them
        if(missing.length) backfillCoords(missing, (id,pt)=>{ CUSTOMERS = CUSTOMERS.map(x=>x.id===id?{...x,...pt}:x); setCustomersState(CUSTOMERS);
          if(db) db.from('customers').update({lat:pt.lat,lng:pt.lng}).eq('id',id).then(logErr('backfill coords')); }); })
      .catch(e=>{ console.error(e); setErr(e.message||String(e)); setPhase('error'); });
  },[]);
  // On start, if this tab still has a token, ask the DATABASE who it belongs to.
  // The identity and permissions come back from the server, so nothing stored in
  // the browser can be edited to gain access.
  useEffect(()=>{
    const saved = recallToken();
    if(!saved || !db){ reloadAll(); return; }
    setDbToken(saved);
    db.rpc('staff_from_token',{ p_token:saved }).then(({data,error})=>{
      const r = Array.isArray(data)?data[0]:data;
      if(error || !r || !r.staff_id){        // expired, signed out elsewhere, or unknown
        setDbToken(null); try{ sessionStorage.removeItem('nelis.view'); }catch(e){}
        reloadAll(); return;
      }
      const u={ id:r.staff_id, name:r.staff_name,
                roles:(r.staff_roles&&r.staff_roles.length?r.staff_roles:['driver']),
                canDelete:!!r.staff_can_delete, active:true };
      setUser(u);
      let v=null; try{ v=sessionStorage.getItem('nelis.view'); }catch(e){}
      const allowed=PORTALS.filter(p=>hasRole(u,p.role));
      setView(v && allowed.some(p=>p.view===v) ? v : (allowed.length===1?allowed[0].view:'picker'));
      reloadAll();
    }).catch(()=>{ setDbToken(null); reloadAll(); });
  },[]);
  useEffect(()=>{ onSaveError=(m)=>setSaveError(m); return ()=>{ onSaveError=null; }; },[]);

  // write-through setters: update the screen AND save to the database
  // Write ONLY the rows that actually changed. This used to save every job on
  // every edit, so a single unsaveable row blocked all other saves.
  const setJobs=useCallback(u=>setJobsState(prev=>{
    const next=typeof u==='function'?u(prev):u;
    const before=new Map(prev.map(j=>[j.id, JSON.stringify(toJobRow(j))]));
    const changed=next.filter(j=>before.get(j.id)!==JSON.stringify(toJobRow(j)));
    if(changed.length) saveJobs(changed);
    return next;
  }),[]);
  const setRates=useCallback(u=>setRatesState(prev=>{ const next=typeof u==='function'?u(prev):u; saveRates(next); return next; }),[]);
  // keep the map's start point on the shop's saved address
  useEffect(()=>{
    const addr=rates.shopAddress; if(!addr) return;
    SHOP.addr=addr; if(rates.shopName) SHOP.name=rates.shopName;
    const pc=(addr.match(/[A-Z]{1,2}\d[A-Z\d]?\s*\d[A-Z]{2}/i)||[''])[0];
    if(!pc) return;
    fetch(`https://api.postcodes.io/postcodes/${encodeURIComponent(pc.replace(/\s+/g,''))}`)
      .then(r=>r.json()).then(j=>{ if(j&&j.status===200&&j.result){ SHOP.lat=j.result.latitude; SHOP.lng=j.result.longitude; } })
      .catch(()=>{});
  },[rates.shopAddress,rates.shopName]);
  const setDrivers=useCallback(u=>setDriversState(prev=>{ const next=typeof u==='function'?u(prev):u; DRIVERS=next; saveDrivers(next); return next; }),[]);
  const deleteDriver=useCallback((id)=>{ setDriversState(prev=>{ const d=prev.find(x=>x.id===id); const next=prev.filter(x=>x.id!==id); DRIVERS=next;
    if(db) db.from('drivers').delete().eq('id',id).then(r=>{ if(r&&r.error) reportErr('delete staff', r.error); });
    if(d) addAudit(`${actor()} removed staff member ${d.name}`); return next; }); },[]);
  const addAudit=useCallback(text=>{ const e={time:now(),text}; setAudit(prev=>[e,...prev]); insertAudit(e); },[]);
  const addOrder=useCallback(o=>{ setOrdersState(prev=>[o,...prev]); saveOrder(o); },[]);
  const updateOrder=useCallback((id,patch)=>{
    let upd=null;
    setOrdersState(prev=>{ const next=prev.map(o=>o.id===id?{...o,...patch}:o);
      upd=next.find(o=>o.id===id); if(upd) saveOrder(upd); return next; });
    // The order and the driver's stop keep SEPARATE copies of packaging, price,
    // payment and dates. Without this, anything changed in the office never
    // reaches the van — the driver keeps seeing the values from when it was
    // first sent out. Only stops still to do are touched; finished ones are history.
    setJobsState(prev=>{
      if(!upd) return prev;
      const job = prev.find(j=>j.orderId===id && j.status==='pending');
      if(!job) return prev;
      const fields = job.type==='delivery'
        ? { packaging:upd.packaging, amount:upd.amount, paymentMethod:upd.paymentMethod,
            paidInAdvance:!!upd.paidInAdvance, bags:upd.bagsCount, weight:upd.weight,
            service:(upd.services||[]).join(', ')||'—',
            runDate: upd.dueDate || job.runDate || TODAY }   // deliver-by decides which day's run
        : { returnDate: upd.dueDate || job.returnDate };     // a collection only shows "return by"
      if(!Object.keys(fields).some(k=>job[k]!==fields[k])) return prev;

      const fromDay = job.runDate||TODAY, toDay = fields.runDate;
      const moved = job.type==='delivery' && toDay && toDay!==fromDay;
      let next = prev.map(j=>j.id===job.id?{...j,...fields}:j);
      if(moved){
        next = reseqDriver(next, job.driverId, fromDay);                    // close the gap on the old day
        const n = next.filter(j=>j.driverId===job.driverId && (j.runDate||TODAY)===toDay && j.id!==job.id).length;
        next = next.map(j=>j.id===job.id?{...j, seq:n+1}:j);                // add to the end of the new day
        addAudit(`${fullName(custById(upd.customerId))}'s delivery moved to ${fmtDate(toDay)}'s run`);
      }
      saveJobs(next.filter(j=>j.id===job.id));
      return next;
    });
  },[addAudit]);
  // stops are numbered per driver PER DAY, so a booking for tomorrow starts at 1 again
  const reseqDriver=(arr,did,day)=>{ const on=j=>j.driverId===did && (!day || (j.runDate||TODAY)===day);
    const mine=arr.filter(on).sort((a,b)=>a.seq-b.seq).map((j,i)=>({...j,seq:i+1}));
    if(db) mine.forEach(j=>db.from('jobs').upsert(toJobRow(j)).then(logErr('reseq'))); return [...arr.filter(j=>!on(j)),...mine]; };
  const deleteJob=useCallback(job=>{
    setJobsState(prev=>{ const rest=prev.filter(j=>j.id!==job.id);
      if(db) db.from('jobs').delete().eq('id',job.id).then(logErr('deleteJob'));
      return reseqDriver(rest, job.driverId, job.runDate||TODAY); });
    // cancelling a booking that was never collected removes its pending order too
    if(job.orderId) setOrdersState(prev=>{ const o=prev.find(x=>x.id===job.orderId);
      if(o && o.status==='Pending Collection'){ if(db) db.from('orders').delete().eq('id',job.orderId).then(logErr('cancelOrder')); return prev.filter(x=>x.id!==job.orderId); }
      return prev; });
    addAudit(`${actor()} cancelled a ${job.type} for ${fullName(custById(job.customerId))}`);
  },[]);
  const addCustomer=useCallback((cust)=>{
    const c = { id:uuid(), lat:null, lng:null, ...cust };  // cust already carries lat/lng from the validated postcode
    CUSTOMERS = [...CUSTOMERS, c];              // keep module array in sync (custById reads it)
    setCustomersState(CUSTOMERS);
    if(db) db.from('customers').insert(toCustomerRow(c)).then(r=>{ if(r&&r.error) reportErr('save customer', r.error); });
    if(c.addr && c.lat==null) geocode(c.addr).then(pt=>{ if(pt){ // only if coordinates weren't provided
      CUSTOMERS = CUSTOMERS.map(x=>x.id===c.id?{...x,...pt}:x); setCustomersState(CUSTOMERS);
      if(db) db.from('customers').update({lat:pt.lat,lng:pt.lng}).eq('id',c.id).then(logErr('geocode'));
    }});
    return c;
  },[]);
  const updateCustomer=useCallback((cust)=>{
    CUSTOMERS = CUSTOMERS.map(x=>x.id===cust.id?{...x,...cust}:x);
    setCustomersState(CUSTOMERS);
    if(db) db.from('customers').update(toCustomerRow(cust)).eq('id',cust.id).then(r=>{ if(r&&r.error) reportErr('update customer', r.error); });
    addAudit(`${actor()} updated ${fullName(cust)}'s details`);
  },[]);
  const deleteCustomer=useCallback((id)=>{
    const c = CUSTOMERS.find(x=>x.id===id);
    // Deleting someone who still has orders or stops leaves those records
    // pointing at nothing, so make the consequence explicit first.
    const theirOrders = orders.filter(o=>o.customerId===id);
    const live = theirOrders.filter(o=>o.status!=='Delivered').length;
    const stops = jobs.filter(j=>j.customerId===id && j.status==='pending').length;
    if(live || stops){
      const bits=[]; if(live) bits.push(`${live} order${live>1?'s':''} still in progress`);
      if(stops) bits.push(`${stops} stop${stops>1?'s':''} on a driver's run`);
      if(!window.confirm(
        `${fullName(c)} has ${bits.join(' and ')}.\n\n`+
        `Deleting them will leave those showing as "Deleted customer" — the orders and stops are NOT removed.\n\n`+
        `Delete anyway?`)) return;
    }
    CUSTOMERS = CUSTOMERS.filter(x=>x.id!==id);
    setCustomersState(CUSTOMERS);
    if(db) db.from('customers').delete().eq('id',id).then(r=>{ if(r&&r.error) reportErr('delete customer', r.error); });
    if(c) addAudit(`${actor()} deleted customer ${fullName(c)}${live||stops?` (had ${live} order(s), ${stops} stop(s))`:''}`);
  },[orders,jobs]);
  const dispatchDelivery=useCallback((order, driverId, window, day)=>{
    const runDate = day || TODAY;
    const nj={ id:uuid(), driverId, type:'delivery', customerId:order.customerId, orderId:order.id, window, status:'pending', runDate,
      packaging:order.packaging, bags:order.bagsCount, weight:order.weight, amount:order.amount,
      service:(order.services||[]).join(', ')||'—', paymentMethod:order.paymentMethod, paidInAdvance:order.paidInAdvance };
    setJobsState(prev=>{ const n=prev.filter(x=>x.driverId===driverId && (x.runDate||TODAY)===runDate).length; const job={...nj,seq:n+1};
      if(db) db.from('jobs').insert(toJobRow(job)).then(r=>{ if(r&&r.error) reportErr('dispatch job', r.error); });
      return [...prev, job]; });
    updateOrder(order.id, { status:'Out for delivery' });
    addAudit(`${actor()} sent ${fullName(custById(order.customerId))}'s order out for delivery`);
  },[updateOrder,addAudit]);
  const deleteOrder=useCallback(orderId=>{
    setOrdersState(prev=>{ const o=prev.find(x=>x.id===orderId); if(o) addAudit(`${actor()} deleted ${fullName(custById(o.customerId))}'s order`); return prev.filter(x=>x.id!==orderId); });
    if(db) db.from('orders').delete().eq('id',orderId).then(logErr('deleteOrder'));
    // also remove any still-pending collection job linked to this order
    setJobsState(prev=>{ const linked=prev.filter(j=>j.orderId===orderId && j.status==='pending');
      if(!linked.length) return prev; const ids=new Set(linked.map(j=>j.id));
      if(db) linked.forEach(j=>db.from('jobs').delete().eq('id',j.id).then(logErr('deleteLinkedJob')));
      let next=prev.filter(j=>!ids.has(j.id));
      [...new Set(linked.map(j=>j.driverId+'|'+(j.runDate||TODAY)))].forEach(k=>{ const [did,day]=k.split('|'); next=reseqDriver(next,did,day); });
      return next; });
  },[]);
  const addJob=useCallback(j=>{
    const isCol = j.type==='collection';
    const orderId = uuid();
    const day = j.runDate||TODAY;
    const base = { id:orderId, customerId:j.customerId, extras:[], needsPricing:false, addedItems:{}, firstOrder:false,
      bagWeights:[], weight:0, packaging:j.packaging, paidInAdvance:!!j.paidInAdvance, notes:j.instructions };
    // A collection starts empty and gets priced at the door.
    // A delivery-only booking is already finished goods going back out, so it
    // enters the list as "Out for delivery" and completes to Delivered.
    const order = isCol
      ? { ...base, services:[], bagsCount:0, weightCharge:0, amount:0, initialAmount:0,
          paymentMethod:'—', collectedDate:null, collectedAt:null,
          dueDate:j.returnDate||addDays(day,2), status:'Pending Collection' }
      : { ...base, services:j.service&&j.service!=='—'?[j.service]:[], bagsCount:j.bags||1,
          weightCharge:j.amount||0, amount:j.amount||0, initialAmount:j.amount||0,
          paymentMethod:j.paymentMethod||'Cash', collectedDate:null, collectedAt:null,
          dueDate:day, status:'Out for delivery' };
    setOrdersState(prev=>[order,...prev]);
    setJobsState(prev=>{
      const n=prev.filter(x=>x.driverId===j.driverId && (x.runDate||TODAY)===day).length;
      const nj={...j, runDate:day, orderId, seq:n+1};
      // persist: order first, THEN the job — awaited so the order exists before the job's FK.
      // If either write fails, take the booking back off the screen: leaving it
      // there would point at an order the database doesn't have, and every later
      // save would fail against that dangling link.
      const undo=(why)=>{
        setJobsState(p=>p.filter(x=>x.id!==nj.id));
        setOrdersState(p=>p.filter(x=>x.id!==orderId));
        if(db) db.from('orders').delete().eq('id',orderId);   // clear a half-written order
        reportErr(why, { message:'the booking was not saved, so it has been removed from the screen — please add it again' });
      };
      (async()=>{
        if(!db) return;
        try {
          const o=await db.from('orders').insert(toOrderRow(order)); if(o.error){ reportErr('save booking', o.error); undo('save booking'); return; }
          const r=await db.from('jobs').insert(toJobRow(nj));        if(r.error){ reportErr('save job', r.error);     undo('save job'); }
        } catch(e){ reportErr('save job', e); undo('save job'); }
      })();
      return [...prev, nj];
    });
    addAudit(`${actor()} booked a ${isCol?'collection':'delivery'} for ${fullName(custById(j.customerId))} on ${fmtDate(day)}`);
  },[addAudit]);
  const go=useCallback(v=>{
    if(v==='logout'){ endStaffSession(); try{ sessionStorage.removeItem('nelis.view'); }catch(e){} setUser(null); setView('picker'); return; }
    try{ sessionStorage.setItem('nelis.view', v); }catch(e){}
    setView(v);
  },[]);
  const onLogin=(s)=>{
    setUser(s);
    const allowed=PORTALS.filter(p=>hasRole(s,p.role));
    const v = allowed.length===1?allowed[0].view:'picker';
    setView(v); try{ sessionStorage.setItem('nelis.view', v); }catch(e){}
    reloadAll();   // the token is set now, so fetch what they're allowed to see
  };

  let screen=null;
  if (phase==='loading') screen=<LoadingScreen/>;
  else if (phase==='error') screen=<ErrorScreen msg={err}/>;
  else if (!user)                 screen=<StaffLogin staff={drivers} onLogin={onLogin}/>;
  else if (view==='driver-app' && hasRole(user,'driver')) screen=<DriverApp driver={user} go={go} jobs={jobs} setJobs={setJobs} orders={orders} customers={customers} rates={rates} addAudit={addAudit} addOrder={addOrder} updateOrder={updateOrder}/>;
  else if (view==='store-app' && hasRole(user,'store'))   screen=<StoreApp go={go} orders={orders} rates={rates} updateOrder={updateOrder} addAudit={addAudit} deleteOrder={deleteOrder} jobs={jobs} drivers={drivers} onDispatch={dispatchDelivery} user={user}/>;
  else if (view==='admin-app' && hasRole(user,'admin'))   screen=<AdminApp go={go} jobs={jobs} setJobs={setJobs} rates={rates} setRates={setRates} audit={audit} drivers={drivers} setDrivers={setDrivers} deleteDriver={deleteDriver} orders={orders} addJob={addJob} updateOrder={updateOrder} addAudit={addAudit} deleteJob={deleteJob} deleteOrder={deleteOrder} dispatchDelivery={dispatchDelivery} customers={customers} addCustomer={addCustomer} updateCustomer={updateCustomer} deleteCustomer={deleteCustomer} user={user}/>;
  else                            screen=<PortalPicker user={user} onPick={v=>setView(v)} onLogout={()=>go('logout')}/>;
  return <>
    {saveError && <div className="fixed top-0 inset-x-0 z-[60] bg-rose-600 text-white text-sm px-4 py-2.5 flex items-center justify-between gap-3 shadow-lg">
      <span className="inline-flex items-start gap-2"><Ic name="alert" size={16} className="mt-0.5 shrink-0"/><span>{saveError}</span></span>
      <button onClick={()=>setSaveError('')} className="shrink-0 opacity-90 hover:opacity-100"><Ic name="close" size={18}/></button>
    </div>}
    {screen}
  </>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
