// PURE pricing engine (unit-tested)
// PURE — price a collection where EACH BAG can be a different service
// (unit-tested). A bag of ironing at £6/kg and a bag of wash-dry-iron at
// £8/kg are charged at their own rates, not lumped onto one.
// bags: [{ weight, serviceKey }]  — serviceKey 'shirts' is counted at the shop.
const SHIRTS_KEY = 'shirts';
function priceBags(rates, bags) {
  const lines=[]; let subtotal=0, weight=0, needsPricing=false;
  (bags||[]).forEach((b,i)=>{
    const kg = parseFloat(b.weight)||0;
    if (b.serviceKey === SHIRTS_KEY) {
      needsPricing = true;                       // counted and priced at the shop
      lines.push({ label:`Bag ${i+1} · Shirt service`, kg:0, amt:0, atShop:true });
      return;
    }
    const r = (rates.weight||[]).find(x=>x.key===b.serviceKey);
    if (!r || kg<=0) return;
    const amt = kg*r.price; subtotal += amt; weight += kg;
    lines.push({ label:`Bag ${i+1} · ${r.label.replace(/ \(.*\)/,'')} — ${kg}kg × ${gbp(r.price)}`, kg, amt });
  });
  return { lines, subtotal, weight, needsPricing };
}

async function roadMatrix(points){

    const shapes=await Promise.all(legs.map(async leg=>{
      if(leg.length<2) return [];
      const url=`https://api.mapbox.com/directions/v5/mapbox/driving/${leg.map(lngLat).join(';')}`
        +`?geometries=geojson&overview=full&access_token=${MAPBOX_TOKEN}`;

      const j=await r.json();

      if(!co) throw new Error('no geometry');

// Turn a matrix into the distance function the optimiser expects.
// Points carry a _i index so lookups are exact.
function matrixDistance(matrix){
  return (a,b)=>{
    const d = (a._i!=null && b._i!=null && matrix[a._i] && matrix[a._i][b._i]!=null)
      ? matrix[a._i][b._i] : null;

/* ---- PURE route optimiser (unit-tested). Straight-line by default. ---- */
function haversineKm(a,b){

function optimiseStops(stops, depot, dist=haversineKm){
  if (stops.length<2) return stops.slice();

    let bi=0,bd=Infinity;
    remaining.forEach((s,i)=>{ const d=dist(cur,s); if(d<bd){bd=d;bi=i;} });
    cur=remaining[bi]; order.push(cur); remaining.splice(bi,1);
  }
  let improved=true, guard=0;
  while(improved && guard++<40){
    improved=false;
    for(let i=0;i<order.length-1;i++){
      for(let k=i+1;k<order.length;k++){
        const cur=routeLengthKm([depot,...order,depot],dist);
        const cand=[...order.slice(0,i),...order.slice(i,k+1).reverse(),...order.slice(k+1)];
        if(routeLengthKm([depot,...cand,depot],dist) < cur-1e-9){ order.splice(0,order.length,...cand); improved=true; }

  const doneJobs = mine.filter(j=>j.status!=='pending');
  const pending  = mine.filter(j=>j.status==='pending');

    return (c&&c.lat!=null)?{id:j.id,lat:c.lat,lng:c.lng}:null; }).filter(Boolean);

async function loadAll() {
  const [cust, drv, rateRows, settings, ord, jb, aud] = await Promise.all([
    db.from('customers').select('*'),
    db.from('drivers').select('id,name,roles,can_delete,active,has_pin,sort_order').eq('active',true).order('sort_order',{nullsFirst:false}).order('created_at'),
    db.from('service_rates').select('*'),
    db.from('app_settings').select('*').limit(1).maybeSingle(),
    db.from('orders').select('*'),
    db.from('jobs').select('*').order('seq'),   // load the active run (not filtered by date)
    db.from('audit_log').select('*').order('created_at',{ascending:false}).limit(200),
  ]);
  const err = cust.error||drv.error||rateRows.error||ord.error||jb.error||aud.error;
  if (err) throw err;
  CUSTOMERS = (cust.data||[]).map(fromCustomerRow);
  DRIVERS   = (drv.data||[]).map(fromDriverRow);
  return { customers: CUSTOMERS, drivers: DRIVERS, rates: ratesFromRows(rateRows.data||[], settings.data),
    orders: (ord.data||[]).map(fromOrderRow), jobs: (jb.data||[]).map(fromJobRow),
    audit: (aud.data||[]).map(r=>({time:r.at, text:r.text})) };
}
let onSaveError = null; // App registers this to surface DB errors on screen
const reportErr = (where, error) => { const msg=(error&&(error.message||error.details||error.hint))||'unknown error';
  console.error('DB '+where, error); if(onSaveError) onSaveError(`Couldn’t save (${where}): ${msg}`); };
const logErr = (where) => (r) => { if (r && r.error) reportErr(where, r.error); };
// save jobs one row at a time — resilient (one bad row can't block the others)
const saveJobs   = arr => { if(!db) return; arr.forEach(j => db.from('jobs').upsert(toJobRow(j)).then(logErr('saveJob'))); };
const saveOrder  = o   => db && db.from('orders').upsert(toOrderRow(o)).then(logErr('saveOrder'));
// PINs are never written from here — set_staff_pin() hashes them server-side.
const saveDrivers= arr => db && db.from('drivers').upsert(arr.map((d,i)=>({id:d.id,name:d.name,roles:d.roles||['driver'],can_delete:!!d.canDelete,active:d.active!==false,sort_order:d.sortOrder!=null?d.sortOrder:(i+1)*10}))).then(logErr('saveDrivers'));
// Proof that this browser passed the PIN check. Held in memory only, so it is
// gone when the tab closes and never written to disk.
let SESSION_TOKEN = null;
// Remembered for THIS BROWSER TAB only, so a refresh doesn't sign you out.
// Closing the tab clears it, and the database still expires the session after
// 12 hours regardless. Only the token is kept — never a PIN, name or role.
const TOKEN_KEY = 'nelis.session';
const rememberToken = (t) => { try{ t ? sessionStorage.setItem(TOKEN_KEY,t) : sessionStorage.removeItem(TOKEN_KEY); }catch(e){} };
const recallToken   = ()  => { try{ return sessionStorage.getItem(TOKEN_KEY); }catch(e){ return null; } };
// swap the client so subsequent queries are made as the signed-in staff member
const setDbToken = (token) => { SESSION_TOKEN = token || null; db = makeDb(SESSION_TOKEN); rememberToken(SESSION_TOKEN); };
const setStaffPin= (id,pin) => db
  ? db.rpc('set_staff_pin',{p_token:SESSION_TOKEN,p_target_id:id,p_pin:String(pin).trim()})
      .then(r=>{ if(r&&r.error){ reportErr('set PIN', r.error); return false; } return true; })
  : Promise.resolve(true);
const endStaffSession = () => { if(db && SESSION_TOKEN) db.rpc('end_staff_session',{p_token:SESSION_TOKEN}); setDbToken(null); };
const insertAudit= e   => db && db.from('audit_log').insert({at:e.time, text:e.text, is_alert:/^No answer/.test(e.text)}).then(logErr('insertAudit'));
const saveRates  = r   => { if(!db) return;
  const rows=[ ...r.weight.map((x,i)=>({key:x.key,kind:'weight',label:x.label,price:x.price,unit:x.unit||'kg',sort:i+1})),
               ...r.items.map((x,i)=>({key:x.key,kind:'item',label:x.label,price:x.price,group_name:x.group,sort:100+i})) ];
  db.from('service_rates').upsert(rows,{onConflict:'key'}).then(logErr('saveRates'));
  // remove any rows the boss deleted (keys no longer present)
  const keys=rows.map(x=>x.key); if(keys.length) db.from('service_rates').delete().not('key','in',`(${keys.join(',')})`).then(logErr('pruneRates'));
  db.from('app_settings').upsert({id:1,min_order:r.minOrder,first_order_discount:r.firstOrderDiscount,

function StaffLogin({ staff, onLogin }) {
  const active = (staff||[]).filter(s=>s.active!==false);
  const preferred = active.find(s=>/mark/i.test(s.name)) || active.find(s=>hasRole(s,'admin')) || active[0];
  const [id,setId]=useState((preferred&&preferred.id)||'');
  const [pin,setPin]=useState(''); const [err,setErr]=useState(''); const [busy,setBusy]=useState(false);

  // The PIN is checked BY THE DATABASE — it is never compared in the browser,
  // and no PIN or hash is ever sent to this page.
  const submit=async()=>{
    const s=active.find(x=>x.id===id);
    if(!s){ setErr('Please pick your name'); return; }
    if(!pin.trim()){ setErr('Enter your PIN'); return; }
    if(busy) return;
    setBusy(true); setErr('');
    try {
      if(!db){ // offline demo fallback only — no database configured
        if(pin===(DRIVERS.find(d=>d.id===id)||{}).pin) onLogin(s); else setErr('Incorrect PIN');
        return;
      }
      const { data, error } = await db.rpc('verify_staff_pin', { p_id:id, p_pin:pin.trim() });
      if(error){
        console.error('verify_staff_pin failed:', error);
        // Show what actually went wrong — a generic message makes this impossible to diagnose.
        const msg=(error.message||'')+' '+(error.details||'')+' '+(error.hint||'');
        setErr(/schema cache|does not exist|not find the function|PGRST202/i.test(msg)
          ? 'Login service not ready yet — run: notify pgrst, \'reload schema\'; in Supabase, wait a few seconds and try again.'
          : `Login failed: ${error.message||'unknown error'}`);
        return; }
      const r = Array.isArray(data) ? data[0] : data;
      if(r && r.ok){
        setPin('');
        setDbToken(r.session_token || null);
        onLogin({ id:r.staff_id, name:r.staff_name, roles:(r.staff_roles&&r.staff_roles.length?r.staff_roles:['driver']),
                  canDelete:!!r.staff_can_delete, active:true });
      } else {
        const secs = r && r.locked_for_seconds;
        setErr(secs ? `${r.reason}. Try again in ${Math.ceil(secs/60)} minute${Math.ceil(secs/60)>1?'s':''}.`
                    : ((r && r.reason) || 'Incorrect PIN'));
        setPin('');
      }
    } finally { setBusy(false); }
  };
  return (
    <div className="min-h-screen flex flex-col items-center justify-center px-4 py-10">
      <Logo h={60} />
      <h1 className="mt-6 text-2xl font-extrabold text-ink">Operations App</h1>

          {active.map(s=><option key={s.id} value={s.id}>{s.name}</option>)}</select></Field>
        <Field label="PIN"><input value={pin} onChange={e=>{setPin(e.target.value);setErr('')}} type="password" placeholder="••••"
          inputMode="numeric" autoComplete="off" className={inputCls+' mt-1'} onKeyDown={e=>e.key==='Enter'&&submit()} /></Field>
        {err && <p className="text-rose-500 text-xs mt-2">{err}</p>}
        <Btn onClick={submit} className="w-full mt-4" {...(busy?{disabled:true}:{})}>{busy?'Checking…':'Sign in'}</Btn>
        <div className="mt-5 pt-4 border-t border-gray-100 text-[11px] text-slate2 flex items-start gap-1.5">
          <Ic name="info" size={13}/><span>PINs are checked securely by the database and are never stored in this page. Preview build — still using sample data, not real customers.</span>

// friendly label for a run date — "Today", "Tomorrow", else the date
const dayLabel = iso => iso===TODAY ? 'Today' : iso===addDays(TODAY,1) ? 'Tomorrow'
  : iso===addDays(TODAY,-1) ? 'Yesterday' : fmtDate(iso);
// PURE — stops that were never done on a day now past (unit-tested).
// Day views only look forward, so without this a stop that got skipped simply
// disappears: nobody looks at last Friday, and the customer never gets a call.
function missedStops(jobs, driverIds, today) {
  const ids = driverIds && driverIds.length ? driverIds : null;
  const late = (jobs||[]).filter(j =>
    j.status === 'pending' &&
    (j.runDate || today) < today &&
    (!ids || ids.includes(j.driverId)));
  const byDay = {};
  late.forEach(j => { const d = j.runDate || today; (byDay[d] = byDay[d] || []).push(j); });
  const days = Object.keys(byDay).sort();
  return { count: late.length, days, oldest: days[0] || null, byDay };
}
// PURE — the next few days as named tabs (unit-tested).
// Mark thinks in "today, tomorrow, Wednesday", not in dates.
function dayTabs(today, span=6, extra=null) {
  const days=[];
  for(let i=0;i<span;i++){ const d=addDays(today,i);
    days.push({ date:d, label: i===0?'Today' : i===1?'Tomorrow'
      : new Date(d+'T00:00:00').toLocaleDateString('en-GB',{weekday:'short'}) }); }
  // a day being viewed that sits outside the window (e.g. next week) still gets a tab
  if(extra && !days.some(d=>d.date===extra))
    days.push({ date:extra, label:fmtDate(extra).replace(/^\w+ /,'') });
  return days;
}
// Remembers which sections you folded, for as long as the tab is open, so a
// long run stays out of the way instead of collapsing again on every visit.
function useCollapsed(key){
  const [set,setSet]=useState(()=>{
    try{ return new Set(JSON.parse(sessionStorage.getItem('nelis.fold.'+key)||'[]')); }
    catch(e){ return new Set(); }
  });
  const toggle=(id)=>setSet(prev=>{
    const next=new Set(prev); next.has(id)?next.delete(id):next.add(id);
    try{ sessionStorage.setItem('nelis.fold.'+key, JSON.stringify([...next])); }catch(e){}
    return next;
  });
  return [set,toggle];
}

function DriverApp({ driver, go, jobs, setJobs, orders, customers, rates, addAudit, addOrder, updateOrder }) {
  const [openId,setOpenId]=useState(null);
  const [day,setDay]=useState(TODAY);
  const [showMap,setShowMap]=useState(false);
  const myJobs = jobs.filter(j=>j.driverId===driver.id && (j.runDate||TODAY)===day).sort((a,b)=>a.seq-b.seq);
  const myPending = myJobs.filter(j=>j.status==='pending');   // only these can be shuffled
  const nextPendingId = (myPending[0]||{}).id;
  const done = myJobs.filter(j=>j.status!=='pending').length;
  const openJob = openId ? jobs.find(j=>j.id===openId) : null;
  useEffect(()=>{ window.scrollTo(0,0); },[openId,day]);  // opening/closing a stop starts at the top
  // how many stops are waiting on other days, so nothing gets silently missed
  const dayCounts = useMemo(()=>{
    const m={}; jobs.forEach(j=>{ if(j.driverId!==driver.id) return;
      const d=j.runDate||TODAY; m[d]=(m[d]||0)+1; });
    return m;
  },[jobs,driver.id]);
  const missed = useMemo(()=>missedStops(jobs,[driver.id],TODAY), [jobs,driver.id]);
  // days AHEAD with work on them; anything behind is handled by the missed banner
  const otherDays = useMemo(()=>{
    const ahead={}; jobs.forEach(j=>{ if(j.driverId!==driver.id||j.status!=='pending') return;
      const d=j.runDate||TODAY; if(d>TODAY && d!==day) ahead[d]=(ahead[d]||0)+1; });
    return Object.entries(ahead).sort((a,b)=>a[0].localeCompare(b[0]));
  },[jobs,driver.id,day]);

  const completeCollection = (job, data) => {
    setJobs(prev => prev.map(j => j.id===job.id ? {...j, status:'done', doneAt:now(), ...data} : j));
    const c = custById(job.customerId);
    const patch = { services:data.services&&data.services.length?data.services:[data.service],
      bagServices:data.bagServices||[], extras:data.extras, needsPricing:data.needsPricing,
      bagsCount:data.bagWeights.length, bagWeights:data.bagWeights, weight:data.weight,
      weightCharge:data.weightCharge, amount:data.amount, initialAmount:data.amount,
      paymentMethod:data.paymentMethod, collectedDate:TODAY, collectedAt:now(),
      status:data.needsPricing?'Needs pricing':'Collected',
      notes:[job.instructions,data.customerNotes,data.shirtCount?`Customer said ~${data.shirtCount} shirts (confirm at shop)`:''].filter(Boolean).join(' · ') };
    if (job.orderId) updateOrder(job.orderId, patch); // move the Pending Collection order to Collected
    else addOrder({ id:uuid(), customerId:job.customerId, addedItems:{}, firstOrder:data.firstOrder,
      packaging:job.packaging, paidInAdvance:job.paidInAdvance, dueDate:job.returnDate||addDays(TODAY,2), ...patch });
    const priceStr = data.needsPricing ? (data.amount>0?gbp(data.amount)+' (provisional)':'priced at shop') : gbp(data.amount);
    addAudit(`${driver.name} collected from ${fullName(c)} · ${priceStr}`);
    setOpenId(null);
  };
  const completeDelivery = (job, payment) => {
    setJobs(prev => prev.map(j => j.id===job.id ? {...j, status:'done', doneAt:now(), paymentMethod:payment} : j));
    if (job.orderId) updateOrder(job.orderId, { status:'Delivered' }); // sync the order
    const payLabel = payment==='Online' ? 'paid online' : payment==='Cash' ? 'paid cash' : payment; // 'Paid in advance'
    addAudit(`${driver.name} delivered to ${fullName(custById(job.customerId))} · ${payLabel}`);
    setOpenId(null);
  };
  const markNoAnswer = (job) => {
    setJobs(prev => prev.map(j => j.id===job.id ? {...j, status:'no-answer', doneAt:now()} : j));
    // collection no-answer -> order can't be collected; delivery no-answer -> back to Ready for another attempt
    if (job.orderId) updateOrder(job.orderId, { status: job.type==='delivery' ? 'Ready' : 'No answer' });
    addAudit(`No answer at ${fullName(custById(job.customerId))} (${job.type}) — needs rescheduling`);
    setOpenId(null);
  };
  // The driver reshuffling his own run — what he'd otherwise scribble as arrows
  // on the paper job sheet. Stamped so Mark can see it changed in Logistics.
  const moveStop = (job, dir) => {
    setJobs(prev => {
      const next = movePendingStop(prev, driver.id, job.id, dir, day);
      if (next===prev) return prev;                       // already top/bottom
      const moved = next.find(j=>j.id===job.id);
      const from = (prev.find(j=>j.id===job.id)||{}).seq, to = moved && moved.seq;
      if (from!==to) addAudit(`${driver.name} moved ${fullName(custById(job.customerId))} from stop ${from} to stop ${to} on ${fmtDate(day)}`);
      return next.map(j => j.id===job.id ? {...j, reorderedBy:driver.name, reorderedAt:now()} : j);
    });
  };
  // Put a finished stop back on the run — for "they've just pulled up" or
  // "I forgot to add two bags". Undoes whatever completing it did.
  const reopenJob = (job) => {
    const order = job.orderId ? orders.find(o=>o.id===job.orderId) : null;
    const check = canReopen(job, order);
    if (!check.ok) { window.alert(check.reason); return; }
    const c = custById(job.customerId);
    const wasNoAnswer = job.status==='no-answer';
    if (!window.confirm(`Put ${fullName(c)} back on your run?`)) return;
    // Everything the driver already entered is kept — the form reopens pre-filled
    // so he can add the extra bag rather than start again.
    setJobs(prev => prev.map(j => j.id===job.id
      ? { ...j, status:'pending', doneAt:undefined, reopened:true }
      : j));
    // The order goes back a step so the shop doesn't act on it, but its figures
    // stay put; re-confirming the stop overwrites them with the updated ones.
    if (order) updateOrder(order.id, job.type==='collection'
      ? { status:'Pending Collection' }
      : { status:'Out for delivery' });
    addAudit(`${driver.name} reopened ${fullName(c)}'s ${job.type}${wasNoAnswer?' (was no answer)':''} — back on the run`);
    setOpenId(job.id);
  };

  return (
    <div className="min-h-screen">
      <TopBar left={
        <div className="flex items-center gap-2">
          {PORTALS.filter(p=>hasRole(driver,p.role)).length>1 && <button onClick={()=>go('picker')} title="Back to portals" className="w-8 h-8 rounded-lg border border-gray-200 flex items-center justify-center text-slate2 hover:bg-gray-50"><Ic name="left" size={18}/></button>}
          <Logo h={26} hideTextOnMobile/></div>} right={
        <div className="flex items-center gap-2"><span className="text-sm text-ink font-semibold hidden sm:inline">{driver.name}</span>
          <Btn kind="ghost" icon="logout" onClick={()=>go('logout')} className="!py-1.5 !px-3">Log out</Btn></div>} />
      <div className="max-w-2xl mx-auto p-4">
        {!openJob && <>
          <div className="flex items-center justify-between mb-1">
            <h2 className="text-xl font-extrabold text-ink">{day===TODAY?'Today’s run':`${dayLabel(day)}’s run`}</h2>
            <Badge tone="grey">{done}/{myJobs.length} done</Badge>
          </div>
          <p className="text-slate2 text-sm mb-1">In driving order. <span className="text-rose-500 font-semibold">Pink = collection</span>, white = delivery. Next job highlighted; done jobs greyed out.</p>
          {myPending.length>1 && <p className="text-slate2 text-xs mb-3 inline-flex items-center gap-1"><Ic name="up" size={13}/>Use the arrows to change the order if you'd rather do a stop earlier — the office sees the change.</p>}
          <div className="mb-3"><DayPicker day={day} setDay={setDay} counts={dayCounts}/></div>
          <MissedBanner missed={missed} onGo={setDay}/>
          {myJobs.length>0 && <div className="bg-white card rounded-2xl p-2 mb-3">
            <button onClick={()=>setShowMap(v=>!v)} className="w-full flex items-center justify-between px-1.5 py-1 text-sm font-semibold text-ink">
              <span className="inline-flex items-center gap-1.5"><Ic name="pin" size={16}/>Your stops on the map</span>
              <span className="text-slate2 inline-flex items-center gap-1 text-xs font-normal">{showMap?'Hide':'Show'}<Ic name={showMap?'up':'down'} size={14}/></span>
            </button>
            {showMap && <div className="mt-2">
              <RouteMap jobs={myJobs} drivers={[driver]} filterDriver={driver.id} customers={customers} height="240px"/>
              <p className="text-[11px] text-slate2 mt-1.5"><span className="text-rose-500 font-semibold">Pink = collection</span>, <span className="text-teal-dark font-semibold">blue = delivery</span>, grey = done. The house marker is the shop.</p>
            </div>}
          </div>}
          {otherDays.length>0 && <div className="mb-3 flex flex-wrap gap-1.5">
            {otherDays.map(([d,n])=>(
              <button key={d} onClick={()=>setDay(d)} className="px-2.5 py-1 rounded-full text-[11px] font-semibold bg-teal-light text-teal-dark">
                {dayLabel(d)} · {n} stop{n===1?'':'s'}</button>))}
          </div>}
          {myJobs.length===0 && <div className="bg-white card rounded-2xl p-8 text-center text-slate2">No stops on {dayLabel(day).toLowerCase()}’s run.</div>}
          <div className="space-y-3">
            {myJobs.map(job => {
              const c = custById(job.customerId);
              const isDone = job.status==='done', isNoAnswer = job.status==='no-answer';
              const resolved = isDone || isNoAnswer;
              const isNext = job.id===nextPendingId;
              const pendingPos = myPending.findIndex(j=>j.id===job.id);
              return (
                <div key={job.id} className={`rounded-2xl p-4 border transition card ${rowTint(job.type,resolved)} ${isNext?'ring-2 ring-teal':''}`}>
                  <div className="flex items-start justify-between gap-3">
                    <div className="flex gap-3">
                      <div className={`w-8 h-8 rounded-full flex items-center justify-center font-bold text-sm shrink-0 ${resolved?'bg-gray-300 text-white':job.type==='collection'?'bg-rose-500 text-white':'bg-teal text-white'}`}>{job.seq}</div>
                      <div>
                        <div className="flex items-center gap-2 flex-wrap">
                          <TypeBadge type={job.type}/>
                          <span className="text-xs text-slate2 inline-flex items-center gap-1"><Ic name="clock" size={13}/>{job.window}</span>
                          {job.paidInAdvance && <Badge tone="green">Paid</Badge>}
                          {isDone && <span className="text-xs text-emerald-600 font-semibold inline-flex items-center gap-1"><Ic name="check" size={13}/>{job.doneAt}</span>}
                          {isNoAnswer && <Badge tone="rose">No answer</Badge>}
                        </div>
                        <div className={`font-semibold mt-1 ${resolved?'text-slate2':'text-ink'}`}>{fullName(c)}</div>
                        <div className={`text-sm ${resolved?'text-gray-400':'text-slate2'}`}>{c.addr}</div>
                        {job.type==='delivery'
                          ? <div className="text-xs text-slate2 mt-0.5 inline-flex items-center gap-1"><Ic name="box" size={13}/>{packLabel(job.packaging)}</div>
                          : job.returnDate && <div className="text-xs text-slate2 mt-0.5">Return {fmtDate(job.returnDate)}</div>}
                        {c && c.standingNotes && <div className="mt-1"><StandingNote customer={c} size="xs"/></div>}
                        {job.instructions && <div className="text-xs text-rose-700 mt-1 bg-rose-50 rounded-lg px-2 py-1 inline-flex items-start gap-1"><Ic name="note" size={13}/><span>{job.instructions}</span></div>}
                      </div>
                    </div>
                    <div className="flex items-center gap-2 shrink-0">
                      {!resolved && myPending.length>1 && (
                        <div className="flex flex-col gap-1">
                          <button onClick={()=>moveStop(job,'up')} title="Move earlier in the run" {...(pendingPos===0?{disabled:true}:{})}
                            className={`w-7 h-6 rounded-md border flex items-center justify-center ${pendingPos===0?'border-gray-100 text-gray-200':'border-gray-200 text-slate2 hover:bg-gray-50 active:bg-gray-100'}`}><Ic name="up" size={15}/></button>
                          <button onClick={()=>moveStop(job,'down')} title="Move later in the run" {...(pendingPos===myPending.length-1?{disabled:true}:{})}
                            className={`w-7 h-6 rounded-md border flex items-center justify-center ${pendingPos===myPending.length-1?'border-gray-100 text-gray-200':'border-gray-200 text-slate2 hover:bg-gray-50 active:bg-gray-100'}`}><Ic name="down" size={15}/></button>
                        </div>)}
                      {resolved
                        ? <button onClick={()=>reopenJob(job)} title="Put this stop back on the run"
                            className="inline-flex items-center gap-1.5 px-2.5 py-1.5 rounded-lg text-xs font-semibold bg-gray-100 text-slate2 border border-gray-200 hover:bg-gray-200 hover:text-ink transition">
                            <Ic name="left" size={13}/>Reopen</button>
                        : <Btn kind={isNext?(job.type==='collection'?'rose':'primary'):'subtle'} onClick={()=>setOpenId(job.id)} className="!py-1.5 !px-3">Open</Btn>}
                    </div>
                  </div>
                </div>
              );
            })}
          </div>
        </>}

        {openJob && (openJob.type==='collection'
          ? <CollectionForm job={openJob} order={openJob.orderId?orders.find(o=>o.id===openJob.orderId):null} rates={rates}
              onBack={()=>setOpenId(null)} onConfirm={completeCollection} onNoAnswer={markNoAnswer} />
          : <DeliveryView job={openJob} onBack={()=>setOpenId(null)} onConfirm={completeDelivery} onNoAnswer={markNoAnswer} />)}
      </div>
    </div>
  );
}

    className="inline-flex items-center gap-1.5 px-4 py-2 rounded-xl text-sm font-semibold bg-white border border-gray-200 text-ink hover:bg-gray-50">
    <Ic name="pin" size={16}/>Directions</a>;
}
function CallBtn({ mob, mob2 }) {
  const nums=[mob,mob2].filter(Boolean);
  if(!nums.length) return null;
  const btn="inline-flex items-center justify-center gap-1.5 px-4 py-2 rounded-xl text-sm font-semibold bg-white border border-gray-200 text-ink hover:bg-gray-50";
  return (<div className="flex flex-col gap-1.5">

  </div>);
}

// PURE — rebuild the collection form from an order that was already filled in,
// so reopening a stop doesn't throw the driver's work away (unit-tested).
function prefillFromOrder(order, job, rates) {
  const firstKey = ((rates.weight||[])[0]||{}).key || 'iron';
  const blank = { bags:[{id:1,weight:'',serviceKey:firstKey}], shirtCount:'',
                  extras:[], firstOrder:false, notes:'', hasPrev:false };
  // nothing was entered before unless the order carries collected details
  if (!order || (!(order.bagWeights||[]).length && !(order.services||[]).length)) return blank;
  const svc = (order.services||[])[0] || '';
  const isShirts = /^Shirt service/.test(svc);
  const match = (rates.weight||[]).find(r=>r.label.replace(/ \(.*\)/,'')===svc);
  // which service each bag was. Older orders have one service for the lot.
  const fallbackKey = isShirts ? SHIRTS_KEY : (match ? match.key : firstKey);
  const svcFor = i => {
    const k=(order.bagServices||[])[i];
    if(k && (k===SHIRTS_KEY || (rates.weight||[]).some(r=>r.key===k))) return k;
    return fallbackKey;
  };
  // order.notes is "instructions · driver note · shirt note" — recover the driver's part
  let notes = order.notes || '';
  if (job && job.instructions && notes.startsWith(job.instructions)) notes = notes.slice(job.instructions.length);
  notes = notes.split(' · ').filter(p=>p.trim() && !/^Customer said ~/.test(p.trim())).join(' · ').trim();
  const shirtNote = (order.notes||'').match(/Customer said ~(\d+) shirts/);
  return {
    bags: (order.bagWeights||[]).length
      ? order.bagWeights.map((w,i)=>({id:i+1, weight:String(w), serviceKey:svcFor(i)}))
      : [{id:1, weight:'', serviceKey:fallbackKey}],
    shirtCount: shirtNote ? shirtNote[1] : '',
    extras: order.extras || [],
    firstOrder: !!order.firstOrder,
    notes,
    hasPrev: true,
  };
}
function CollectionForm({ job, order, rates, onBack, onConfirm, onNoAnswer }) {
  const c = custById(job.customerId);
  // If this stop was filled in before and reopened, start from what the driver
  // already entered rather than a blank form — he's usually just adding a bag.
  const pre = useMemo(()=>prefillFromOrder(order, job, rates), []);
  const [bags,setBags]=useState(pre.bags);          // [{id, weight, serviceKey}]
  const [shirtCount,setShirtCount]=useState(pre.shirtCount);
  const [extras,setExtras]=useState(pre.extras);
  const [firstOrder,setFirstOrder]=useState(pre.firstOrder);
  const [notes,setNotes]=useState(pre.notes);
  const [confirmed,setConfirmed]=useState(false);

  // Each bag is priced at its OWN rate, so one bag of ironing and one of
  // wash-dry-iron on the same collection come out right.
  const priced = useMemo(()=>priceBags(rates, bags), [rates,bags]);
  const result = useMemo(()=>orderTotal(rates, priced.subtotal, {}, firstOrder), [rates,priced.subtotal,firstOrder]);
  const anyShirts = bags.some(b=>b.serviceKey===SHIRTS_KEY);
  const svcLabels = bagServiceLabels(rates, bags);
  const needsPricing = extras.length>0 || anyShirts;
  const canConfirm = anyShirts || result.charged>0;
  const confirmData = { bagWeights:bags.map(b=>parseFloat(b.weight)||0),
    bagServices:bags.map(b=>b.serviceKey), weight:priced.weight,
    service:svcLabels.join(', ')||'—', services:svcLabels,
    weightCharge:priced.subtotal, amount:result.charged, firstOrder,
    paymentMethod:'On delivery', customerNotes:notes, extras, needsPricing,
    shirtCount:anyShirts?shirtCount:'' };

  const defaultSvc = (rates.weight[0]||{}).key || 'iron';
  const addBag=()=>setBags(b=>[...b,{id:(b[b.length-1]?.id||0)+1,weight:'',
    serviceKey:(b[b.length-1]||{}).serviceKey||defaultSvc}]);   // same service as the last bag
  const rmBag=id=>setBags(b=>b.length>1?b.filter(x=>x.id!==id):b);
  const setBagW=(id,v)=>setBags(b=>b.map(x=>x.id===id?{...x,weight:v}:x));
  const setBagSvc=(id,v)=>setBags(b=>b.map(x=>x.id===id?{...x,serviceKey:v}:x));
  const toggleExtra=x=>setExtras(e=>e.includes(x)?e.filter(y=>y!==x):[...e,x]);

  if (confirmed) return (
    <div className="bg-white card rounded-2xl p-8 text-center">
      <div className="w-16 h-16 mx-auto rounded-full bg-emerald-50 text-emerald-600 flex items-center justify-center"><Ic name="check" size={34} stroke={2.4}/></div>
      <h3 className="text-xl font-bold text-ink mt-3">Collection confirmed</h3>
      <p className="text-slate2 mt-1">{fullName(c)} · {result.charged>0?gbp(result.charged)+(needsPricing?' (provisional)':''):'priced at shop'}</p>
      {needsPricing && <div className="bg-amber-50 text-amber-700 rounded-xl p-3 mt-4 text-sm inline-flex items-center gap-2"><Ic name="alert" size={16}/>{anyShirts?`Shirts will be counted & priced at the shop${extras.length?`, along with ${extras.join(', ').toLowerCase()}`:''}.`:`Extras noted — shop will price ${extras.join(', ').toLowerCase()} and finalise the total.`}</div>}
      <div className="bg-teal-light text-teal-dark rounded-xl p-3 mt-3 text-sm flex items-center justify-center gap-2"><Ic name="mail" size={16}/>{needsPricing?'Provisional':'Receipt'} email sent to {c.email}</div>
      <div className="mt-6"><Btn icon="right" onClick={()=>onConfirm(job,confirmData)}>Back to run</Btn></div>
    </div>
  );

  return (
    <div>
      <button onClick={onBack} className="text-slate2 text-sm mb-3 inline-flex items-center gap-1"><Ic name="left" size={15}/>Back to run</button>
      {pre.hasPrev && <div className="mb-3 rounded-xl border border-amber-200 bg-amber-50 px-3 py-2 text-[13px] text-amber-800 flex items-start gap-2">
        <Ic name="info" size={16} className="mt-0.5 shrink-0"/>
        <span><b>Reopened</b> — everything you entered before is still here. Add or change what you need, then confirm again.</span></div>}
      <div className="bg-white card rounded-2xl p-5">
        <div className="flex items-start justify-between gap-2">
          <div><TypeBadge type="collection"/>
            <h3 className="text-lg font-bold text-ink mt-1">{fullName(c)}</h3>
            <p className="text-sm text-slate2">{c.addr}</p>
            {job.returnDate && <p className="text-xs text-slate2 mt-0.5">Return {fmtDate(job.returnDate)}</p>}
          </div>
          <div className="flex flex-col gap-2 shrink-0"><DirectionsBtn addr={c.addr}/><CallBtn mob={c.mob} mob2={c.mob2}/></div>
        </div>
        {c && c.standingNotes && <div className="mt-3"><StandingNote customer={c}/></div>}
        {job.instructions && <div className="text-xs text-rose-700 mt-2 bg-rose-50 rounded-lg px-2 py-1.5 inline-flex items-start gap-1"><Ic name="note" size={14}/><span>Boss note: {job.instructions}</span></div>}

        <hr className="my-4 border-gray-100"/>
        <div className="flex items-center justify-between">
          <h4 className="font-bold text-ink text-sm">Bags</h4>
          <Btn kind="subtle" icon="plus" onClick={addBag} className="!py-1 !px-2 text-xs">Add bag</Btn>
        </div>
        <p className="text-xs text-slate2 mb-2">Each bag can be a different service — weigh it and pick what it is.</p>
        <div className="space-y-2">
          {bags.map((b,i)=>{ const shirts=b.serviceKey===SHIRTS_KEY;
            const r=rates.weight.find(x=>x.key===b.serviceKey);
            return (
            <div key={b.id} className="rounded-xl border border-gray-100 bg-gray-50/60 p-2.5">
              <div className="flex items-center gap-2">
                <span className="w-7 h-7 rounded-full bg-teal text-white text-xs font-bold flex items-center justify-center shrink-0">{i+1}</span>
                <select value={b.serviceKey} onChange={e=>setBagSvc(b.id,e.target.value)} className={inputCls+' !py-1.5 flex-1 min-w-0'}>
                  {rates.weight.map(x=><option key={x.key} value={x.key}>{x.label.replace(/ \(.*\)/,'')} — {gbp(x.price)}/kg</option>)}
                  <option value={SHIRTS_KEY}>Shirt service — counted at the shop</option>
                </select>
                {bags.length>1 && <button onClick={()=>rmBag(b.id)} title="Remove bag"
                  className="text-rose-400 hover:text-rose-600 shrink-0"><Ic name="close" size={16}/></button>}
              </div>
              <div className="flex items-center gap-2 mt-2 pl-9">
                {shirts
                  ? <span className="text-xs text-amber-700 inline-flex items-center gap-1"><Ic name="info" size={13}/>No need to weigh — the shop counts the shirts.</span>
                  : <>
                      <input type="number" min="0" step="0.1" value={b.weight} onChange={e=>setBagW(b.id,e.target.value)}
                        inputMode="decimal" className={inputCls+' !w-24 text-right !py-1.5'} placeholder="0.0"/>
                      <span className="text-xs text-slate2">kg</span>
                      {r && parseFloat(b.weight)>0 && <span className="text-sm font-semibold text-ink ml-auto">{gbp((parseFloat(b.weight)||0)*r.price)}</span>}
                    </>}
              </div>
            </div>); })}
          <div className="text-sm text-ink font-semibold pt-1">
            Total weight: {priced.weight.toFixed(1)} kg <span className="text-slate2 font-normal">across {bags.length} bag{bags.length>1?'s':''}</span></div>
        </div>

        {anyShirts && <div className="mt-3 bg-amber-50 border border-amber-100 rounded-xl p-3">
          <div className="text-sm font-semibold text-ink">Shirts — counted at the shop</div>
          <p className="text-xs text-amber-700 mb-2">No need to count or price on the doorstep.</p>
          <div className="flex items-center gap-2">
            <span className="text-sm text-slate2">Shirts (only if the customer gave a number)</span>
            <input type="number" min="0" step="1" value={shirtCount} onChange={e=>setShirtCount(e.target.value)} className={inputCls+' !w-20 text-right'} placeholder="—"/>
          </div>
        </div>}

        <h4 className="font-bold text-ink text-sm mt-4 mb-1">Extras in the bag <span className="text-slate2 font-normal">— priced at the shop</span></h4>
        <p className="text-xs text-slate2 mb-2">Just tick what the customer says is in there. No need to unpack or price it at the door.</p>
        <div className="flex flex-wrap gap-2">
          {EXTRA_TYPES.map(x=>(
            <button key={x} onClick={()=>toggleExtra(x)}
              className={`inline-flex items-center gap-1 px-3 py-1.5 rounded-full text-xs font-semibold border transition ${extras.includes(x)?'bg-amber-50 border-amber-300 text-amber-700':'bg-white border-gray-200 text-slate2 hover:border-gray-300'}`}>
              {extras.includes(x)&&<Ic name="check" size={13}/>}{x}</button>))}
        </div>
        {needsPricing && <div className="text-xs text-amber-700 bg-amber-50 rounded-lg px-2 py-1.5 mt-2 inline-flex items-center gap-1"><Ic name="alert" size={14}/>{anyShirts?'Shirts and any extras are counted & priced at the shop.':'Price below is provisional — shop finalises it.'}</div>}

        <label className="flex items-center gap-2 mt-3 text-sm text-ink">
          <input type="checkbox" checked={firstOrder} onChange={e=>setFirstOrder(e.target.checked)} className="accent-teal"/> Apply first-order discount (10%)</label>

        <h4 className="font-bold text-ink text-sm mt-4 mb-1">Customer notes <span className="text-slate2 font-normal">(seen by boss &amp; store team)</span></h4>
        <textarea value={notes} onChange={e=>setNotes(e.target.value)} rows="2" placeholder="e.g. stain on white shirt collar, handle silk gently…" className={inputCls}></textarea>

        <div className="bg-gray-50 rounded-xl p-4 mt-4">
          {priced.lines.length===0
            ? <p className="text-slate2 text-sm">Enter bag weights to calculate the price…</p>
            : <div className="space-y-1">
                {priced.lines.map((l,i)=>(<div key={i} className="flex justify-between text-sm text-slate2">
                  <span>{l.label}</span><span>{l.atShop?'at shop':gbp(l.amt)}</span></div>))}
                {result.discount>0 && <div className="flex justify-between text-sm text-emerald-600"><span>First-order discount</span><span>−{gbp(result.discount)}</span></div>}
                {result.belowMin && <div className="flex justify-between text-xs text-amber-600"><span>Below {gbp(rates.minOrder)} minimum — rounded up</span><span></span></div>}
              </div>}
          <div className="flex justify-between items-center mt-2 pt-2 border-t border-gray-200">
            <span className="font-bold text-ink">{needsPricing?'Provisional total':'Total to charge'}</span>

          <div className="flex justify-between"><span className="text-slate2">Bags</span><span>{job.bags} · {job.weight}kg</span></div>

        {job.instructions && <div className="text-xs text-rose-700 mt-2 bg-rose-50 rounded-lg px-2 py-1.5 inline-flex items-start gap-1"><Ic name="note" size={14}/><span>Boss note: {job.instructions}</span></div>}
        {paid

              <div className="flex gap-4">
                <label className="flex items-center gap-1.5 text-sm text-ink"><input type="radio" name="dpay" checked={payment==='Cash'} onChange={()=>setPayment('Cash')} className="accent-teal"/> Cash collected</label>
                <label className="flex items-center gap-1.5 text-sm text-ink"><input type="radio" name="dpay" checked={payment==='Online'} onChange={()=>setPayment('Online')} className="accent-teal"/> Paying online</label>
              </div>
            </>}
        <Btn kind="green" icon="check" className="w-full mt-4" onClick={()=>onConfirm(job, paid?'Paid in advance':payment)}>Confirm bags delivered</Btn>
        <button onClick={()=>onNoAnswer(job)} className="w-full mt-2 border-2 border-rose-200 bg-white text-rose-600 rounded-xl py-2 text-sm font-semibold inline-flex items-center justify-center gap-1.5 hover:bg-rose-50 transition"><Ic name="alert" size={15}/>No answer — reschedule</button>

/* =================================================================== */
/*  ORDER TIMELINE + DETAIL / PRICING MODAL                            */
/* =================================================================== */
const LIFECYCLE = ['Pending Collection','Collected','In Shop','Ready','Out for delivery','Delivered'];
const statusToStep = s => ({ 'Pending Collection':0,'No answer':0,'Booked':0,'Needs pricing':1,'Collected':1,'In Shop':2,'In progress':2,'Ready':3,'Out for delivery':4,'Delivered':5 }[s] ?? 1);
// generic "Mark next" only up to Ready — after Ready the shop dispatches (Send out for delivery)
const NEXT_STATUS = { 'Collected':'In Shop', 'In Shop':'Ready' };
function statusTone(s){ return s==='Ready'?'green':s==='In Shop'?'amber':s==='Collected'?'teal':s==='Out for delivery'?'violet':s==='Needs pricing'?'rose':s==='No answer'?'rose':s==='Pending Collection'?'slate':'grey'; }

function Timeline({ status }) {
  const active = statusToStep(status);
  return (
    <div className="mt-1">
      {LIFECYCLE.map((step,i)=>{
        const doneStep = i<active, cur = i===active;
        return (
          <div key={step} className="flex gap-3">
            <div className="flex flex-col items-center">
              <div className={`w-3.5 h-3.5 rounded-full border-2 ${cur?'bg-teal border-teal':doneStep?'bg-teal-dark border-teal-dark':'bg-white border-gray-300'}`}></div>
              {i<LIFECYCLE.length-1 && <div className={`w-0.5 flex-1 min-h-[18px] ${doneStep?'bg-teal-dark':'bg-gray-200'}`}></div>}
            </div>
            <div className={`text-sm pb-2 ${cur?'text-ink font-semibold':doneStep?'text-slate2':'text-gray-300'}`}>{step}
              {cur && status==='Needs pricing' && <span className="ml-2"><Badge tone="rose">Needs pricing</Badge></span>}</div>
          </div>);
      })}
    </div>
  );
}

function OrderModal({ order, rates, onClose, onSave, addAudit, onDelete, onDispatch, jobs, drivers, user }) {
  const c = custById(order.customerId);
  const driverStaff = (drivers||[]).filter(d=>hasRole(d,'driver'));
  const actor = (user&&user.name) || 'Someone';
  const assignedJob = (jobs||[]).find(j=>j.orderId===order.id);
  const assignedDriver = assignedJob && (drivers||[]).find(d=>d.id===assignedJob.driverId);
  const [pricing,setPricing]=useState(order.needsPricing);
  const [added,setAdded]=useState(order.addedItems||{});
  const [dispDriver,setDispDriver]=useState((driverStaff[0]&&driverStaff[0].id)||'');
  const [dispWindow,setDispWindow]=useState(EVENING_RUN);
  const [dispDay,setDispDay]=useState(TODAY);
  const [dispPack,setDispPack]=useState(packLabel(order.packaging)!=='—'?packLabel(order.packaging):PACKAGING[0]);
  const groups = useMemo(()=>{ const g={}; rates.items.forEach(r=>{(g[r.group]=g[r.group]||[]).push(r)}); return g; },[rates]);
  // rebuild what the driver entered per bag, so the shop sees each rate applied
  const bagLines = useMemo(()=>priceBags(rates,
    (order.bagWeights||[]).map((w,i)=>({ weight:w, serviceKey:(order.bagServices||[])[i] }))
  ).lines, [rates, order.bagWeights, order.bagServices]);
  const calc = useMemo(()=>orderTotal(rates, order.weightCharge, added, order.firstOrder), [rates,order,added]);

  // ---- edit the order's own details (service, weight, due date, packaging, payment, notes) ----
  const [editing,setEditing]=useState(false);
  const rowsFromOrder = () => {
    const ws=order.bagWeights||[], ks=order.bagServices||[];
    const fallback = (rates.weight.find(r=>r.label.replace(/ \(.*\)/,'')===(order.services||[])[0])||rates.weight[0]||{}).key;
    if(!ws.length) return [];
    return ws.map((w,i)=>({ id:i+1, weight:String(w),
      serviceKey: (ks[i] && (ks[i]===SHIRTS_KEY || rates.weight.some(r=>r.key===ks[i]))) ? ks[i] : fallback }));
  };
  const [eRows,setERows]=useState(rowsFromOrder);
  const [eCharge,setECharge]=useState(order.weightCharge||0);
  const [eExtras,setEExtras]=useState(order.extras||[]);
  const [eDue,setEDue]=useState(order.dueDate||'');
  const [ePack,setEPack]=useState(order.packaging||PACKAGING[0]);
  const [ePay,setEPay]=useState(order.paymentMethod||'—');
  const [eNotes,setENotes]=useState(order.notes||'');
  const [chargeTouched,setChargeTouched]=useState(false);
  const ePriced = useMemo(()=>priceBags(rates, eRows), [rates,eRows]);
  // re-price from the bags whenever they change, unless a figure was typed in by hand
  useEffect(()=>{ if(!editing||chargeTouched) return;
    setECharge(+ePriced.subtotal.toFixed(2));
  },[ePriced.subtotal,editing,chargeTouched]);
  const eAddRow=()=>setERows(r=>[...r,{id:(r[r.length-1]?.id||0)+1,weight:'',
    serviceKey:(r[r.length-1]||{}).serviceKey||(rates.weight[0]||{}).key}]);
  const eRmRow=id=>setERows(r=>r.filter(x=>x.id!==id));
  const eSetW=(id,v)=>setERows(r=>r.map(x=>x.id===id?{...x,weight:v}:x));
  const eSetSvc=(id,v)=>setERows(r=>r.map(x=>x.id===id?{...x,serviceKey:v}:x));
  const editCalc = useMemo(()=>orderTotal(rates, parseFloat(eCharge)||0, added, order.firstOrder), [rates,eCharge,added,order.firstOrder]);
  const startEdit=()=>{ setERows(rowsFromOrder());
    setECharge(order.weightCharge||0); setEExtras(order.extras||[]); setEDue(order.dueDate||''); setEPack(order.packaging||PACKAGING[0]);
    setEPay(order.paymentMethod||'—'); setENotes(order.notes||''); setChargeTouched(false); setPricing(false); setEditing(true); };
  const toggleExtra=(x)=>setEExtras(list=>list.includes(x)?list.filter(y=>y!==x):[...list,x]);
  const saveEdit=()=>{
    const wc=parseFloat(eCharge)||0, wt=ePriced.weight, bags=eRows.length;
    const patch={ services:bagServiceLabels(rates,eRows), bagServices:eRows.map(r=>r.serviceKey),
      bagWeights:eRows.map(r=>parseFloat(r.weight)||0),
      weight:wt, bagsCount:bags, weightCharge:wc, extras:eExtras,
      dueDate:eDue||order.dueDate, packaging:ePack, paymentMethod:ePay, notes:eNotes,
      amount:editCalc.charged, needsPricing: order.needsPricing && eExtras.length>0 };
    // describe what actually changed, for the audit trail
    const ch=[];
    if((order.services||[]).join(', ')!==bagServiceLabels(rates,eRows).join(', ')) ch.push(`services → ${bagServiceLabels(rates,eRows).join(' + ')||'none'}`);
    if((order.weight||0)!==wt) ch.push(`weight → ${wt}kg`);
    if((order.bagsCount||0)!==bags) ch.push(`bags → ${bags}`);
    if((order.extras||[]).join(',')!==eExtras.join(',')) ch.push(`extras → ${eExtras.join(', ')||'none'}`);
    if((order.dueDate||'')!==(eDue||order.dueDate)) ch.push(`deliver by → ${fmtDate(eDue)}`);
    if((order.packaging||'')!==ePack) ch.push(`packaging → ${ePack}`);
    if((order.paymentMethod||'')!==ePay) ch.push(`payment → ${ePay}`);
    if((order.notes||'')!==eNotes) ch.push('notes updated');
    if(Math.abs((order.amount||0)-editCalc.charged)>0.005) ch.push(`price ${gbp(order.amount)} → ${gbp(editCalc.charged)}`);
    onSave(order.id, patch);
    if(ch.length) addAudit(`${actor} amended ${fullName(c)}'s order: ${ch.join('; ')}`);
    setEditing(false);
  };

  const save = () => {
    onSave(order.id, { addedItems:added, amount:calc.charged, needsPricing:false,
      status: order.status==='Needs pricing'?'In Shop':order.status });
    addAudit(`${actor} priced ${fullName(c)}: ${gbp(order.initialAmount)} → ${gbp(calc.charged)}`);
    onClose();
  };
  const advance = () => { const ns=NEXT_STATUS[order.status]; if(!ns) return;
    onSave(order.id, { status:ns }); addAudit(`${actor} marked ${fullName(c)}'s order ${ns}`); };
  const dispatch = () => { if(!dispDriver) return;
    if(dispPack!==order.packaging) onSave(order.id,{ packaging:dispPack });   // remember how it was packed
    onDispatch({...order, packaging:dispPack}, dispDriver, dispWindow, dispDay); onClose(); };

  return (
    <div className="fixed inset-0 bg-black/40 flex items-center justify-center p-4 z-50" onClick={onClose}>
      <div className="bg-white rounded-2xl w-full max-w-2xl max-h-[92vh] overflow-y-auto" onClick={e=>e.stopPropagation()}>
        <div className="flex items-center justify-between px-5 py-4 border-b border-gray-100 sticky top-0 bg-white">
          <div><h3 className="text-lg font-bold text-ink">{fullName(c)}</h3><p className="text-sm text-slate2">{c.addr}</p></div>
          <button onClick={onClose} className="text-slate2 hover:text-ink"><Ic name="close" size={20}/></button>
        </div>
        <div className="p-5 grid md:grid-cols-2 gap-5">
          <div>
            <div className="flex items-center justify-between mb-2">
              <h4 className="font-bold text-ink text-sm">Order details</h4>
              {!editing && <Btn kind="subtle" icon="edit" className="!py-1 !px-2 text-xs" onClick={startEdit}>Edit details</Btn>}
            </div>
            {editing ? (<div className="space-y-2.5">
              <div>
                <div className="flex items-center justify-between mb-1">
                  <div className="text-xs font-semibold text-slate2">Bags &amp; services</div>
                  <Btn kind="subtle" icon="plus" onClick={eAddRow} className="!py-0.5 !px-2 text-[11px]">Add bag</Btn>
                </div>
                {eRows.length===0 && <p className="text-[11px] text-slate2">No bags — priced by item only.</p>}
                <div className="space-y-1.5">
                  {eRows.map((r,i)=>{ const rt=rates.weight.find(x=>x.key===r.serviceKey); const shirts=r.serviceKey===SHIRTS_KEY;
                    return (
                    <div key={r.id} className="flex items-center gap-1.5">
                      <span className="text-[11px] text-slate2 w-8 shrink-0">Bag {i+1}</span>
                      <select value={r.serviceKey} onChange={e=>eSetSvc(r.id,e.target.value)} className={inputCls+' !py-1 flex-1 min-w-0 text-xs'}>
                        {rates.weight.map(x=><option key={x.key} value={x.key}>{x.label.replace(/ \(.*\)/,'')} — {gbp(x.price)}/kg</option>)}
                        <option value={SHIRTS_KEY}>Shirt service — at shop</option>
                      </select>
                      <input type="number" min="0" step="0.1" value={r.weight} onChange={e=>eSetW(r.id,e.target.value)}
                        {...(shirts?{disabled:true}:{})} className={inputCls+' !w-16 !py-1 text-right text-xs'} placeholder="0.0"/>
                      <span className="text-[11px] text-slate2 shrink-0">kg</span>
                      <span className="text-xs font-semibold text-ink w-14 text-right shrink-0">{shirts?'at shop':gbp((parseFloat(r.weight)||0)*((rt||{}).price||0))}</span>
                      <button onClick={()=>eRmRow(r.id)} title="Remove bag" className="text-rose-400 hover:text-rose-600 shrink-0"><Ic name="close" size={14}/></button>
                    </div>); })}
                </div>
              </div>
              <Field label="Weight charge £"><input type="number" min="0" step="0.5" value={eCharge}
                onChange={e=>{setECharge(e.target.value);setChargeTouched(true);}} className={inputCls+' mt-1'}/>
                <p className="text-[11px] text-slate2 mt-1">Adds the bags up at their own rates. Type over it to set your own figure.</p></Field>
              <div><div className="text-xs font-semibold text-slate2 mb-1">Extras flagged</div>
                <div className="flex flex-wrap gap-2">{EXTRA_TYPES.map(x=>(
                  <button key={x} onClick={()=>toggleExtra(x)} className={`px-2.5 py-1 text-[11px] rounded-full font-semibold border ${eExtras.includes(x)?'bg-amber-100 text-amber-800 border-amber-300':'bg-white text-slate2 border-gray-200'}`}>{x}</button>))}</div></div>
              <div className="grid grid-cols-2 gap-2">
                <Field label="Deliver by"><input type="date" value={eDue} onChange={e=>setEDue(e.target.value)} className={inputCls+' mt-1'}/></Field>
                <Field label="Packaging"><select value={ePack} onChange={e=>setEPack(e.target.value)} className={inputCls+' mt-1'}>
                  {PACKAGING.map(p=><option key={p}>{p}</option>)}</select></Field>
              </div>
              <Field label="Payment"><select value={ePay} onChange={e=>setEPay(e.target.value)} className={inputCls+' mt-1'}>
                {['—','On delivery','Cash','Card','Online','Bank transfer'].map(p=><option key={p}>{p}</option>)}</select></Field>
              <Field label="Notes"><textarea value={eNotes} onChange={e=>setENotes(e.target.value)} rows={2} className={inputCls+' mt-1'}/></Field>
              <div className="bg-teal-light rounded-xl p-2.5 flex justify-between items-center">
                <span className="font-semibold text-ink text-sm">New total</span>
                <span className="text-lg font-extrabold text-teal-dark">{gbp(editCalc.charged)}</span></div>
              <div className="flex gap-2">
                <Btn kind="ghost" onClick={()=>setEditing(false)} className="flex-1">Cancel</Btn>
                <Btn kind="primary" icon="check" onClick={saveEdit} className="flex-1">Save</Btn>
              </div>
            </div>) : (<>
            <div className="text-sm space-y-1.5">
              <Row k="Services" v={(order.services||[]).join(' + ')||'—'}/>
              {(order.extras||[]).length>0 && <Row k="Extras" v={<span className="text-amber-700">{(order.extras||[]).join(', ')}</span>}/>}
              <Row k="Bags" v={order.bagsCount>0?`${order.bagsCount} · ${(order.bagWeights||[]).join('+')}kg = ${order.weight}kg`:'—'}/>
              <Row k="Packaging" v={packLabel(order.packaging)}/>
              {assignedDriver && <Row k="Driver" v={<span className="inline-flex items-center gap-1"><Ic name="truck" size={13}/>{assignedDriver.name}</span>}/>}
              <Row k="Collected" v={order.collectedDate?`${fmtDate(order.collectedDate)} · ${order.collectedAt}`:'Not yet collected'}/>
              <Row k="Deliver by" v={fmtDate(order.dueDate)}/>
              <Row k="Payment" v={order.paidInAdvance?'Paid in advance':(order.paymentMethod==='—'?'—':order.paymentMethod)}/>
              <Row k="Price" v={order.status==='Pending Collection'?'—':<span className="font-bold text-ink">{gbp(order.amount)}{order.needsPricing&&<span className="text-rose-500 font-normal"> (provisional)</span>}</span>}/>
            </div>
            {c && c.standingNotes && <div className="mt-3"><StandingNote customer={c}/></div>}
            {order.notes && <div className="text-xs text-ink mt-2 bg-amber-50 border border-amber-100 rounded-lg px-2 py-1.5 flex items-start gap-1"><Ic name="note" size={14}/><span>{order.notes}</span></div>}
            <h4 className="font-bold text-ink text-sm mt-5 mb-1">Progress</h4>
            <Timeline status={order.status}/>
            {order.status==='Pending Collection' &&
              <p className="text-xs text-slate2 mt-2 inline-flex items-center gap-1"><Ic name="clock" size={14}/>Awaiting driver collection.</p>}
            {order.status==='No answer' &&
              <p className="text-xs text-rose-600 mt-2 inline-flex items-center gap-1"><Ic name="alert" size={14}/>No answer at the door — needs rescheduling.</p>}
            {order.status==='Out for delivery' &&
              <p className="text-xs text-violet-600 mt-2 inline-flex items-center gap-1"><Ic name="truck" size={14}/>On {assignedDriver?assignedDriver.name+"’s":'a driver’s'} run — delivers when confirmed.</p>}
            {order.status==='Delivered' &&
              <p className="text-xs text-emerald-600 mt-2 inline-flex items-center gap-1"><Ic name="check" size={14}/>Delivered.</p>}

                    {calc.discount>0 && <div className="flex justify-between text-emerald-600"><span>First-order discount</span><span>−{gbp(calc.discount)}</span></div>}
                    {order.weightCharge===0 && calc.lines.length===0 && <div className="text-slate2">Nothing priced yet.</div>}
                    <div className="flex justify-between items-center pt-1.5 border-t border-gray-200"><span className="font-bold text-ink">Total</span><span className="font-extrabold text-ink">{gbp(order.amount)}</span></div>

                  <p className="text-xs text-slate2 mt-2">{calc.lines.length>0?'Extras added at the shop are listed above. ':''}Tap <b>Amend price</b> to add, change or remove dry cleaning, bedding or repairs.</p>
                </div>
              : <>
                  <div className="bg-gray-50 rounded-xl p-3 text-sm mb-3">
                    {bagLines.length>0
                      ? bagLines.map((l,i)=>(<div key={i} className="flex justify-between text-slate2"><span>{l.label}</span><span>{l.atShop?'at shop':gbp(l.amt)}</span></div>))
                      : <div className="flex justify-between text-slate2"><span>{(order.services||[]).join(', ')||'Weight-based'}</span><span>{gbp(order.weightCharge)}</span></div>}
                  </div>
                  <p className="text-[11px] text-slate2 -mt-2 mb-2">Set a quantity to <b>0</b> (or clear it) to remove something added by mistake.</p>
                  <div className="max-h-56 overflow-y-auto pr-1">
                    {Object.entries(groups).map(([g,list])=>(
                      <div key={g} className="mb-2">
                        <div className="text-[11px] font-semibold text-teal-dark uppercase tracking-wide mb-1">{g}</div>
                        {list.map(r=>(
                          <div key={r.key} className="flex items-center justify-between gap-2 py-0.5">
                            <span className="text-sm text-ink">{r.label.replace(/^Dry clean — /,'')} <span className="text-slate2">{gbp(r.price)}</span></span>
                            <input type="number" min="0" step="1" value={added[r.key]||''} onChange={e=>setAdded({...added,[r.key]:e.target.value})} className={inputCls+' !w-16 text-right !py-1'} placeholder="0"/>
                          </div>))}
                      </div>))}
                  </div>
                  <div className="bg-teal-light rounded-xl p-3 mt-2">
                    {calc.lines.map((l,i)=>(<div key={i} className="flex justify-between text-sm text-teal-dark"><span>{l.label}</span><span>{gbp(l.amt)}</span></div>))}
                    <div className="flex justify-between items-center mt-1 pt-1 border-t border-teal/30">
                      <span className="font-bold text-ink">New total</span><span className="text-xl font-extrabold text-teal-dark">{gbp(calc.charged)}</span></div>
                  </div>
                  <Btn kind="primary" icon="check" className="w-full mt-3" onClick={save}>Save &amp; notify customer</Btn>
                  <p className="text-[11px] text-slate2 text-center mt-1.5">Logged to the audit trail; customer emailed the updated total.</p>
                </>}
          </div>
        </div>
        {onDelete && mayDelete(user) && <div className="px-5 pb-5">
          <button onClick={()=>{ if(window.confirm(`Delete this order for ${fullName(c)}? This can’t be undone.`)){ onDelete(order.id); onClose(); } }}
            className="w-full border-2 border-rose-200 bg-white text-rose-600 rounded-xl py-2 text-sm font-semibold inline-flex items-center justify-center gap-1.5 hover:bg-rose-50 transition">
            <Ic name="trash" size={15}/>Delete this order</button>
        </div>}
      </div>
    </div>
  );
}
function Row({ k, v }) { return <div className="flex justify-between gap-4"><span className="text-slate2">{k}</span><span className="text-ink text-right">{v}</span></div>; }

function StoreLogin({ go, onLogin }) {

    <LoginCard go={go} title="Store team sign in" sub="Shop-floor view of what's in and going out.">
      <Field label="PIN"><input value={pin} onChange={e=>{setPin(e.target.value);setErr('')}} type="password" placeholder="2222"
        className={inputCls+' mt-1'} onKeyDown={e=>e.key==='Enter'&&submit()} /></Field>
      {err && <p className="text-rose-500 text-xs mt-2">{err}</p>}
      <Btn onClick={submit} className="w-full mt-4">Log in</Btn>

}
function StoreApp({ go, orders, rates, updateOrder, addAudit, deleteOrder, jobs, drivers, onDispatch, user }) {
  const [scope,setScope]=useState(TODAY);
  const [sel,setSel]=useState(null);
  const list = useMemo(()=>storeList(orders, scope, TODAY), [orders,scope]);
  const lateCount = list.filter(o=>(o.dueDate||'')<TODAY).length;
  const dayCounts = useMemo(()=>{ const m={};
    (orders||[]).forEach(o=>{ if(!IN_SHOP_STATUSES.includes(o.status)) return;
      const d=o.dueDate||''; if(d) m[d]=(m[d]||0)+1; }); return m; },[orders]);

  const printList = () => {
    const itemLabel = k => { const r=rates.items.find(x=>x.key===k); return r ? r.label.replace(/^Dry clean — /,'') : k; };
    const addedStr = o => Object.entries(o.addedItems||{}).filter(([k,q])=>parseInt(q)>0).map(([k,q])=>`${itemLabel(k)} ×${q}`).join(', ');
    const rows = list.map(o=>{ const c=custById(o.customerId); const extra = addedStr(o) || ((o.extras||[]).length ? (o.extras||[]).join(', ') : '');
      return `<tr><td><b>${fmtDate(o.dueDate)}</b></td><td>${fullName(c)}<br><span class="a">${c.addr}</span></td>
        <td>${(o.services||[]).join(' + ')}${extra?`<br><span class="r">+ ${extra}</span>`:''}</td>
        <td>${o.bagsCount} (${(o.bagWeights||[]).join('+')}kg) · ${o.weight}kg${(o.bagServices||[]).length>1?'<br><span class="a">mixed services</span>':''}</td>
        <td>${gbp(o.amount)}${o.needsPricing?' <span class="r">(prov.)</span>':''}<br><span class="a">${o.paidInAdvance?'PAID':o.paymentMethod}</span></td>
        <td>${packLabel(o.packaging)}</td><td>${o.collectedDate?`${fmtDate(o.collectedDate)} ${o.collectedAt||''}`:'—'}</td><td>${o.status==='Needs pricing'?`<span class="r">${o.status}</span>`:o.status}</td><td>${c&&c.standingNotes?`<b class="v">Always: ${c.standingNotes}</b><br>`:''}${o.notes||''}</td></tr>`; }).join('');
    const html = `<html><head><title>NELIS — ${scope==='week'?'This week':dayLabel(scope)}</title>
      <style>body{font-family:Arial;padding:18px;color:#1f2a30}h1{font-size:16px;margin:0}.sub{color:#777;font-size:12px;margin:2px 0 12px}
      table{width:100%;border-collapse:collapse;font-size:11px}th{background:#3AAFCB;color:#fff;text-align:left;padding:5px 6px}
      td{border-bottom:1px solid #ddd;padding:5px 6px;vertical-align:top}.a{color:#888;font-size:10px}.r{color:#dc2626;font-weight:bold}.v{color:#6d28d9}@media print{@page{size:landscape;margin:10mm}}</style></head>
      <body><h1>NEL Ironing Service — Production list</h1><div class="sub">${scope==='week'?'Due this week':'Due '+dayLabel(scope).toLowerCase()} · printed ${fmtDate(TODAY)} · ${list.length} order(s)</div>
      <table><thead><tr><th>Due</th><th>Customer</th><th>Services</th><th>Bags / weight</th><th>Price</th><th>Pack</th><th>Collected</th><th>Status</th><th>Notes</th></tr></thead>
      <tbody>${rows}</tbody></table></body></html>`;
    const w = window.open('','_blank'); if(!w){alert('Please allow pop-ups to print the list.');return;}
    w.document.write(html); w.document.close(); w.focus(); setTimeout(()=>w.print(),300);
  };

  return (
    <div className="min-h-screen">
      <TopBar left={
        <div className="flex items-center gap-2">
          {user && PORTALS.filter(p=>hasRole(user,p.role)).length>1 && <button onClick={()=>go('picker')} title="Back to portals" className="w-8 h-8 rounded-lg border border-gray-200 flex items-center justify-center text-slate2 hover:bg-gray-50"><Ic name="left" size={18}/></button>}
          <Logo h={26} hideTextOnMobile/></div>} right={
        <div className="flex items-center gap-2"><span className="text-sm text-ink font-semibold hidden sm:inline">{user?user.name:'Store team'}</span>
          <Btn kind="ghost" icon="logout" onClick={()=>go('logout')} className="!py-1.5 !px-3">Log out</Btn></div>} />
      <div className="max-w-5xl mx-auto p-4">
        <div className="flex items-center justify-between mb-1 flex-wrap gap-2">
          <h2 className="text-xl font-extrabold text-ink">Production list</h2>
          <div className="flex items-center gap-2">
            <button onClick={()=>setScope('week')} className={`px-3 py-1.5 rounded-xl text-sm font-semibold card ${scope==='week'?'bg-teal text-white':'bg-white text-slate2'}`}>This week</button>
            <Btn kind="ghost" icon="printer" onClick={printList}>Print / PDF</Btn>
          </div>
        </div>
        <p className="text-slate2 text-sm mb-1">Sorted by soonest due first, so you know which bags to deal with first. Tap an order for full details and to price extras.</p>
        <p className="text-slate2 text-xs mb-4">Overdue work is pinned to Today so it can't be missed.</p>
        <div className="mb-3"><DayPicker day={scope==='week'?TODAY:scope} setDay={setScope} counts={dayCounts}/></div>
        {lateCount>0 && <div className="mb-3 rounded-xl border border-rose-200 bg-rose-50 px-3 py-2 text-sm text-rose-700 font-semibold inline-flex items-center gap-2">
          <Ic name="alert" size={16}/>{lateCount} order{lateCount>1?'s are':' is'} past the delivery date</div>}

        {list.length===0 ? <div className="bg-white card rounded-2xl p-8 text-center text-slate2">Nothing in the shop due {scope==='week'?'this week':dayLabel(scope).toLowerCase()}.</div>
        : <div className="space-y-3">
            {list.map(o=>{ const c=custById(o.customerId); const dueToday=o.dueDate===TODAY; const late=(o.dueDate||'')<TODAY;
              return (
                <button key={o.id} onClick={()=>setSel(o)} className={`w-full text-left bg-white card rounded-2xl p-4 border-l-4 hover:ring-2 hover:ring-teal/40 transition ${late?'border-rose-500':o.needsPricing?'border-rose-400':dueToday?'border-teal':'border-gray-200'}`}>
                  <div className="flex flex-wrap items-start justify-between gap-3">
                    <div className="min-w-[180px]">
                      <div className="flex items-center gap-2 flex-wrap">
                        {late && <Badge tone="rose">Overdue</Badge>}
                        <Badge tone={late?'rose':dueToday?'teal':'grey'}>Due {fmtDate(o.dueDate)}</Badge>
                        <Badge tone={statusTone(o.status)}>{o.status}</Badge>
                        {o.paidInAdvance && <Badge tone="green">Paid</Badge>}
                      </div>
                      <div className="font-semibold text-ink mt-1.5">{fullName(c)}</div>
                      <div className="text-sm text-slate2">{c.addr}</div>
                      {(o.extras||[]).length>0 && <div className="text-xs text-amber-700 mt-1 inline-flex items-center gap-1"><Ic name="alert" size={13}/>To price: {(o.extras||[]).join(', ')}</div>}
                    </div>
                    <div className="text-sm grid grid-cols-2 gap-x-6 gap-y-0.5">
                      <span className="text-slate2">Services</span><span className="text-ink text-right">{(o.services||[]).join(' + ')||'—'}</span>
                      <span className="text-slate2">Bags</span><span className="text-ink text-right">{o.bagsCount} · {o.weight}kg</span>
                      <span className="text-slate2">Price</span><span className="text-ink text-right">{gbp(o.amount)}{o.needsPricing?' (prov.)':''}</span>
                      <span className="text-slate2">Collected</span><span className="text-ink text-right">{o.collectedDate?`${fmtDate(o.collectedDate)} · ${o.collectedAt||''}`:'Not collected — delivery only'}</span>
                    </div>
                  </div>
                  {c && c.standingNotes && <div className="mt-2"><StandingNote customer={c} size="xs"/></div>}
                  {o.notes && <div className="text-xs text-ink mt-2 bg-amber-50 border border-amber-100 rounded-lg px-2 py-1 inline-flex items-start gap-1"><Ic name="note" size={13}/><span>{o.notes}</span></div>}
                </button>);
            })}
          </div>}
      </div>
      {sel && <OrderModal order={orders.find(o=>o.id===sel.id)||sel} rates={rates} onClose={()=>setSel(null)} onSave={updateOrder} addAudit={addAudit} onDelete={deleteOrder} onDispatch={onDispatch} jobs={jobs} drivers={drivers} user={user}/>}
    </div>
  );
}

function AdminLogin({ go, onLogin }) {

function AdminApp({ go, jobs, setJobs, rates, setRates, audit, drivers, setDrivers, deleteDriver, orders, addJob, updateOrder, addAudit, deleteJob, deleteOrder, dispatchDelivery, customers, addCustomer, updateCustomer, deleteCustomer, user }) {
  const [tab,setTab]=useState('overview');
  const [intake,setIntake]=useState(false);
  const [ordersFilter,setOrdersFilter]=useState('all');
  useEffect(()=>{ window.scrollTo(0,0); },[tab]);   // every tab opens at the top
  const goStat = which => {
    if (which==='customers') setTab('customers');
    else if (which==='jobs') setTab('logistics');
    else if (which==='pricing') { setOrdersFilter('needsPricing'); setTab('orders'); }
  };
  const tabs=[['overview','chart','Overview'],['customers','users','Customers'],['orders','layers','Orders'],
    ['pricing','tag','Pricing'],['staff','user','Staff'],['logistics','pin','Logistics']];
  return (
    <div className="min-h-screen">
      <TopBar left={
        <div className="flex items-center gap-2">
          {user && PORTALS.filter(p=>hasRole(user,p.role)).length>1 && <button onClick={()=>go('picker')} title="Back to portals" className="w-8 h-8 rounded-lg border border-gray-200 flex items-center justify-center text-slate2 hover:bg-gray-50"><Ic name="left" size={18}/></button>}
          <Logo h={26} hideTextOnMobile/></div>} right={
        <div className="flex items-center gap-2">
          <span className="text-sm text-ink font-semibold hidden sm:inline">{user?user.name:'Boss'}</span>
          <Btn kind="rose" icon="plus" onClick={()=>setIntake(true)} className="!py-1.5 !px-3">New job</Btn>
          <Btn kind="ghost" icon="logout" onClick={()=>go('logout')} className="!py-1.5 !px-3">Log out</Btn></div>} />
      <div className="max-w-5xl mx-auto p-4">
        <div className="flex flex-wrap gap-1 mb-4 bg-white rounded-2xl p-1 card">
          {tabs.map(([k,ic,l])=>(<button key={k} onClick={()=>{ setTab(k); if(k==='orders') setOrdersFilter('all'); }}
            className={`px-3.5 py-2 rounded-xl text-sm font-semibold whitespace-nowrap inline-flex items-center gap-1.5 ${tab===k?'bg-teal text-white':'text-slate2 hover:bg-gray-50'}`}><Ic name={ic} size={15}/>{l}</button>))}
        </div>
        {tab==='overview'  && <Overview jobs={jobs} orders={orders} audit={audit} onNew={()=>setIntake(true)} goStat={goStat}/>}
        {tab==='customers' && <Customers customers={customers} addCustomer={addCustomer} updateCustomer={updateCustomer} deleteCustomer={deleteCustomer} user={user}/>}
        {tab==='orders'    && <Orders orders={orders} rates={rates} updateOrder={updateOrder} addAudit={addAudit} filter={ordersFilter} onClearFilter={()=>setOrdersFilter('all')} deleteOrder={deleteOrder} jobs={jobs} drivers={drivers} onDispatch={dispatchDelivery} user={user}/>}
        {tab==='pricing'   && <Pricing rates={rates} setRates={setRates} canDelete={mayDelete(user)}/>}
        {tab==='staff'     && <StaffAdmin drivers={drivers} setDrivers={setDrivers} deleteDriver={deleteDriver} user={user}/>}
        {tab==='logistics' && <Logistics jobs={jobs} setJobs={setJobs} drivers={drivers} onNew={()=>setIntake(true)} deleteJob={deleteJob} customers={customers} user={user}/>}
      </div>
      {intake && <IntakeModal drivers={drivers} onClose={()=>setIntake(false)} onCreate={addJob} customers={customers} addCustomer={addCustomer}/>}
    </div>
  );
}

function IntakeModal({ drivers, onClose, onCreate, customers, addCustomer }) {
  const driverStaff = (drivers||[]).filter(d=>hasRole(d,'driver'));
  const [q,setQ]=useState(''); const [customerId,setCustomerId]=useState(null); const [addingCust,setAddingCust]=useState(false);
  const [type,setType]=useState('collection'); const [driverId,setDriverId]=useState((driverStaff[0]||{}).id);
  const [runDate,setRunDate]=useState(TODAY);   // which day's run this booking goes on
  const [returnDate,setReturnDate]=useState(addDays(TODAY,2)); const [packaging,setPackaging]=useState(PACKAGING[0]);
  const [instructions,setInstructions]=useState(''); const [paid,setPaid]=useState(false); const [window_,setWindow]=useState(EVENING_RUN);
  // delivery-only bookings: what's owed and how it's being settled
  const [amount,setAmount]=useState(''); const [payMethod,setPayMethod]=useState('Cash');
  const [service,setService]=useState(''); const [bags,setBags]=useState('1');
  const isDelivery = type==='delivery';
  // keep the return-by date sensible when the collection is pushed to a later day
  useEffect(()=>{ setReturnDate(rd => rd < addDays(runDate,1) ? addDays(runDate,2) : rd); },[runDate]);
  const matches = q.trim().length<1 ? [] : (customers||[]).filter(c=>(fullName(c)+' '+c.addr).toLowerCase().includes(q.toLowerCase())).slice(0,6);
  const chosen = customerId ? custById(customerId) : null;
  const create=()=>{ if(!customerId)return;
    onCreate({ id:uuid(), driverId, type, customerId, window:window_, status:'pending', packaging, instructions, runDate,
      returnDate: type==='collection'?returnDate:undefined, paidInAdvance:paid,
      ...(isDelivery?{}:{packaging:null}),   // decided later, at the shop
      ...(isDelivery?{ bags:parseInt(bags)||1, weight:0, amount:parseFloat(amount)||0,
                       service:service.trim()||'—', paymentMethod: paid?'Paid in advance':payMethod }:{}) });
    onClose(); };
  return (
    <div className="fixed inset-0 bg-black/40 flex items-center justify-center p-4 z-50" onClick={onClose}>
      <div className="bg-white rounded-2xl p-6 w-full max-w-md max-h-[92vh] overflow-y-auto" onClick={e=>e.stopPropagation()}>
        <div className="flex items-center justify-between mb-1">
          <h3 className="text-lg font-bold text-ink">New job from WhatsApp / SMS</h3>
          <button onClick={onClose} className="text-slate2 hover:text-ink"><Ic name="close" size={20}/></button>
        </div>
        <p className="text-xs text-slate2 mb-3">Log a booking so it appears in the driver's run.</p>
        <div className="bg-gray-100 rounded-xl p-1 flex mb-3">
          {[['collection','Collection','truck'],['delivery','Delivery','box']].map(([k,l,ic])=>(
            <button key={k} onClick={()=>setType(k)}
              className={`flex-1 px-3 py-2 rounded-lg text-sm font-semibold inline-flex items-center justify-center gap-1.5 transition ${type===k?(k==='collection'?'bg-rose-500 text-white':'bg-teal text-white'):'text-slate2 hover:bg-white/60'}`}>
              <Ic name={ic} size={15}/>{l}</button>))}
        </div>
        <p className="text-[11px] text-slate2 mb-3">{isDelivery
          ? 'Dropping finished laundry back to a customer. Enter what’s owed and how they’re paying.'
          : 'Picking laundry up. Price is captured at the door — no need to enter it here.'}</p>
        <Field label="Find customer by name or address">
          <div className="relative mt-1">
            <span className="absolute left-3 top-1/2 -translate-y-1/2 text-slate2"><Ic name="search" size={16}/></span>
            <input value={q} onChange={e=>{setQ(e.target.value);setCustomerId(null);}} placeholder="e.g. Myrtle Rd or Grace" className={inputCls+' pl-9'} />
          </div>
        </Field>
        {!chosen && matches.map(c=>(
          <button key={c.id} onClick={()=>{setCustomerId(c.id);setQ(fullName(c));}} className="w-full text-left px-3 py-2 hover:bg-gray-50 border-b border-gray-100 text-sm">
            <div className="font-medium text-ink">{fullName(c)}</div><div className="text-slate2 text-xs">{c.addr}</div></button>))}
        {chosen && <div className="bg-teal-light rounded-xl px-3 py-2 mt-2 text-sm">
          <div className="font-semibold text-ink">{fullName(chosen)}</div><div className="text-slate2 text-xs">{chosen.addr}{[chosen.mob,chosen.mob2].filter(Boolean).map(n=>' · '+n).join('')}</div></div>}
        {q.trim() && !chosen && matches.length===0 &&
          <button onClick={()=>setAddingCust(true)} className="w-full text-left mt-1 px-3 py-2 rounded-lg bg-teal-light text-teal-dark text-sm font-semibold inline-flex items-center gap-1.5"><Ic name="plus" size={15}/>Add “{q.trim()}” as a new customer</button>}
        {!chosen && q.trim()==='' &&
          <button onClick={()=>setAddingCust(true)} className="text-teal-dark text-xs font-semibold mt-1 inline-flex items-center gap-1"><Ic name="plus" size={13}/>New customer</button>}
        {addingCust && <AddCustomerModal initialName={q.trim()} onClose={(c)=>{ setAddingCust(false); if(c){ setCustomerId(c.id); setQ(fullName(c)); } }} onCreate={addCustomer} customers={customers}/>}
        <div className="grid grid-cols-2 gap-3 mt-4">
          <div className="col-span-2"><Field label="Assign driver"><select value={driverId} onChange={e=>setDriverId(e.target.value)} className={inputCls+' mt-1'}>
            {driverStaff.map(d=><option key={d.id} value={d.id}>{d.name}</option>)}</select></Field></div>
          <div className="col-span-2"><Field label={type==='collection'?'Collection date':'Delivery date'}>
            <input type="date" value={runDate} min={TODAY} onChange={e=>setRunDate(e.target.value)} className={inputCls+' mt-1'}/>
            <div className="flex gap-1.5 mt-1.5">
              {[['Today',TODAY],['Tomorrow',addDays(TODAY,1)],[fmtDate(addDays(TODAY,2)).split(' ')[0],addDays(TODAY,2)]].map(([l,d])=>(
                <button key={d} onClick={()=>setRunDate(d)} className={`px-2.5 py-1 rounded-full text-[11px] font-semibold border ${runDate===d?'bg-teal text-white border-teal':'bg-white text-slate2 border-gray-200'}`}>{l}</button>))}
            </div></Field></div>
          <Field label="Time window"><select value={window_} onChange={e=>setWindow(e.target.value)} className={inputCls+' mt-1'}>
            <WindowOptions/></select></Field>
          {type==='collection' && <Field label="Return by"><input type="date" value={returnDate} min={runDate} onChange={e=>setReturnDate(e.target.value)} className={inputCls+' mt-1'}/></Field>}
          {isDelivery && <div className="col-span-2"><Field label="Packaging"><select value={packaging} onChange={e=>setPackaging(e.target.value)} className={inputCls+' mt-1'}>
            {PACKAGING.map(p=><option key={p}>{p}</option>)}</select></Field></div>}
        </div>
        {runDate!==TODAY && <p className="text-[11px] text-teal-dark font-semibold mt-2 inline-flex items-center gap-1"><Ic name="clock" size={13}/>Booked for {fmtDate(runDate)} — it'll appear on that day's run, not today's.</p>}

        {isDelivery && <div className="mt-4 rounded-xl border border-teal/30 bg-teal-light/50 p-3">
          <div className="text-xs font-bold text-teal-dark mb-2 inline-flex items-center gap-1"><Ic name="tag" size={14}/>What's being delivered &amp; payment</div>
          <div className="grid grid-cols-2 gap-3">
            <Field label="Service"><input value={service} onChange={e=>setService(e.target.value)} placeholder="e.g. Ironing" className={inputCls+' mt-1'}/></Field>
