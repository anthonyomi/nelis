// PURE pricing engine (unit-tested)
function calcPrice(rates, weightInputs, itemInputs, firstOrder) {
  let subtotal = 0; const lines = [];
  rates.weight.forEach(r => { const kg = parseFloat(weightInputs[r.key]) || 0;
    if (kg > 0) { const amt = kg*r.price; subtotal += amt; lines.push({label:`${r.label} — ${kg}kg × ${gbp(r.price)}`, amt}); } });
  rates.items.forEach(r => { const q = parseInt(itemInputs[r.key]) || 0;
    if (q > 0) { const amt = q*r.price; subtotal += amt; lines.push({label:`${r.label} × ${q}`, amt}); } });
  const discount = firstOrder ? subtotal*rates.firstOrderDiscount : 0;
  const afterDisc = subtotal - discount;
  const belowMin = afterDisc > 0 && afterDisc < rates.minOrder;
  const charged = belowMin ? rates.minOrder : afterDisc;
  return { lines, subtotal, discount, afterDisc, charged, belowMin };
}
// PURE order total from a stored weight charge + shop-added items (unit-tested)
function orderTotal(rates, weightCharge, addedItems, firstOrder) {
  let subtotal = weightCharge; const lines = [];
  rates.items.forEach(r => { const q = parseInt(addedItems[r.key]) || 0;
    if (q > 0) { const amt = q*r.price; subtotal += amt; lines.push({label:`${r.label} × ${q}`, amt}); } });
  const discount = firstOrder ? subtotal*rates.firstOrderDiscount : 0;
  const afterDisc = subtotal - discount;
  const belowMin = afterDisc > 0 && afterDisc < rates.minOrder;
  const charged = belowMin ? rates.minOrder : afterDisc;
  return { lines, subtotal, discount, charged, belowMin };
}
// PURE reorder helpers (unit-tested)
function reorderJobs(jobs, driverId, jobId, targetJobId) {
  const mine = jobs.filter(j=>j.driverId===driverId).sort((a,b)=>a.seq-b.seq);
  const others = jobs.filter(j=>j.driverId!==driverId);
  const from = mine.findIndex(j=>j.id===jobId);
  const to = mine.findIndex(j=>j.id===targetJobId);
  if (from<0 || to<0) return jobs;
  const arr = mine.slice(); const [moved] = arr.splice(from,1); arr.splice(to,0,moved);
  return [...others, ...arr.map((j,i)=>({...j, seq:i+1}))];
}
function moveJob(jobs, driverId, jobId, dir) {
  const mine = jobs.filter(j=>j.driverId===driverId).sort((a,b)=>a.seq-b.seq);
  const i = mine.findIndex(j=>j.id===jobId); const j = dir==='up'?i-1:i+1;
  if (i<0 || j<0 || j>=mine.length) return jobs;
  return reorderJobs(jobs, driverId, jobId, mine[j].id);
}
function moveJobTo(jobs, jobId, toDriverId, targetJobId) {
  const job = jobs.find(j=>j.id===jobId); if (!job) return jobs;
  if (job.driverId===toDriverId) return targetJobId ? reorderJobs(jobs, toDriverId, jobId, targetJobId) : jobs;
  const fromDriverId = job.driverId;
  const others = jobs.filter(j=>j.driverId!==fromDriverId && j.driverId!==toDriverId);
  const source = jobs.filter(j=>j.driverId===fromDriverId && j.id!==jobId).sort((a,b)=>a.seq-b.seq).map((j,i)=>({...j, seq:i+1}));
  const target = jobs.filter(j=>j.driverId===toDriverId).sort((a,b)=>a.seq-b.seq);
  let idx = targetJobId ? target.findIndex(j=>j.id===targetJobId) : target.length; if (idx<0) idx = target.length;
  const nt = target.slice(); nt.splice(idx,0,{...job, driverId:toDriverId});
  return [...others, ...source, ...nt.map((j,i)=>({...j, seq:i+1}))];
}

/* ---- PURE route optimiser (unit-tested). Free: runs in the app, no API. ---- */
function haversineKm(a,b){
  const R=6371, rad=x=>x*Math.PI/180;
  const dLat=rad(b.lat-a.lat), dLng=rad(b.lng-a.lng);
  const s=Math.sin(dLat/2)**2 + Math.cos(rad(a.lat))*Math.cos(rad(b.lat))*Math.sin(dLng/2)**2;
  return 2*R*Math.asin(Math.sqrt(s));
}
function routeLengthKm(points){ let t=0; for(let i=0;i<points.length-1;i++) t+=haversineKm(points[i],points[i+1]); return t; }
// nearest-neighbour, then 2-opt clean-up. Round starts and ends at `depot`.
function optimiseStops(stops, depot){
  if (stops.length<2) return stops.slice();
  const remaining=stops.slice(), order=[]; let cur=depot;
  while(remaining.length){
    let bi=0,bd=Infinity;
    remaining.forEach((s,i)=>{ const d=haversineKm(cur,s); if(d<bd){bd=d;bi=i;} });
    cur=remaining[bi]; order.push(cur); remaining.splice(bi,1);
  }
  let improved=true, guard=0;
  while(improved && guard++<40){
    improved=false;
    for(let i=0;i<order.length-1;i++){
      for(let k=i+1;k<order.length;k++){
        const cur=routeLengthKm([depot,...order,depot]);
        const cand=[...order.slice(0,i),...order.slice(i,k+1).reverse(),...order.slice(k+1)];
        if(routeLengthKm([depot,...cand,depot]) < cur-1e-9){ order.splice(0,order.length,...cand); improved=true; }
      }
    }
  }
  return order;
}
// reorder one driver's PENDING stops; already-done stops keep their place at the front
function optimiseDriver(jobs, driverId){
  const mine = jobs.filter(j=>j.driverId===driverId).sort((a,b)=>a.seq-b.seq);
  const doneJobs = mine.filter(j=>j.status!=='pending');
  const pending  = mine.filter(j=>j.status==='pending');
  const stops = pending.map(j=>{ const c=custById(j.customerId);
    return (c&&c.lat!=null)?{id:j.id,lat:c.lat,lng:c.lng}:null; }).filter(Boolean);
  if (stops.length<2) return jobs;
  const lastDone = doneJobs.length ? custById(doneJobs[doneJobs.length-1].customerId) : null;
  const start = (lastDone&&lastDone.lat!=null) ? {lat:lastDone.lat,lng:lastDone.lng} : SHOP;
  const rank={}; optimiseStops(stops,start).forEach((s,i)=>rank[s.id]=i+1);
  const newPending=[...pending].sort((a,b)=>(rank[a.id]||99)-(rank[b.id]||99));
  return [...jobs.filter(j=>j.driverId!==driverId),
          ...[...doneJobs,...newPending].map((j,i)=>({...j,seq:i+1}))];
}
function totalMiles(jobs, driverIds){
  let km=0;
  driverIds.forEach(did=>{
    const pts=jobs.filter(j=>j.driverId===did).sort((a,b)=>a.seq-b.seq)
      .map(j=>custById(j.customerId)).filter(c=>c&&c.lat!=null);
    if(pts.length) km+=routeLengthKm([SHOP,...pts,SHOP]);
  });
  return km*0.621371;
}

// free address -> lat/lng lookup for the map (no key). UK postcode first (very reliable), then full address.
async function geocode(addr){
  if(!addr) return null;
  const pc = (addr.match(/[A-Z]{1,2}\d[A-Z\d]?\s*\d[A-Z]{2}/i)||[])[0];
  if (pc){ try { const r=await fetch(`https://api.postcodes.io/postcodes/${encodeURIComponent(pc.replace(/\s+/g,''))}`);
    const j=await r.json(); if (j && j.result && j.result.latitude!=null) return { lat:j.result.latitude, lng:j.result.longitude };
  } catch(e){} }
  try { const r=await fetch(`https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=gb&q=${encodeURIComponent(addr)}`);
    const j=await r.json(); if (j && j[0]) return { lat:parseFloat(j[0].lat), lng:parseFloat(j[0].lon) };
  } catch(e){} return null;
}
// fill in coordinates for any customers that don't have them yet (runs one at a time)
async function backfillCoords(list, onUpdate){
  for (const c of list){ if (!c.addr || c.lat!=null) continue; const pt=await geocode(c.addr); if (pt) onUpdate(c.id, pt); }
}
// split a stored address string back into line1 / town / postcode for editing
function splitAddr(addr){
  const pc=((addr||'').match(/[A-Z]{1,2}\d[A-Z\d]?\s*\d[A-Z]{2}/i)||[''])[0];
  const rest=(addr||'').replace(pc,'').replace(/,\s*$/,'').trim();
  const parts=rest.split(',').map(s=>s.trim()).filter(Boolean);
  return { line1:parts[0]||'', town:parts.slice(1).join(', ')||'', pc };
}

async function loadAll() {
  const [cust, drv, rateRows, settings, ord, jb, aud] = await Promise.all([
    db.from('customers').select('*'),
    db.from('drivers').select('*').eq('active',true).order('created_at'),
    db.from('service_rates').select('*'),
    db.from('app_settings').select('*').limit(1).maybeSingle(),
    db.from('orders').select('*'),
    db.from('jobs').select('*').order('seq'),   // load the active run (not filtered by date)
    db.from('audit_log').select('*').order('created_at',{ascending:false}).limit(200),
  ]);
  const err = cust.error||drv.error||rateRows.error||ord.error||jb.error||aud.error;
  if (err) throw err;
  CUSTOMERS = (cust.data||[]).map(fromCustomerRow);
  DRIVERS   = (drv.data||[]).map(fromDriverRow);

    audit: (aud.data||[]).map(r=>({time:r.at, text:r.text})) };
}

                      <div className={`w-8 h-8 rounded-full flex items-center justify-center font-bold text-sm shrink-0 ${resolved?'bg-gray-300 text-white':job.type==='collection'?'bg-rose-500 text-white':'bg-teal text-white'}`}>{job.seq}</div>
                      <div>
                        <div className="flex items-center gap-2 flex-wrap">
                          <TypeBadge type={job.type}/>
                          <span className="text-xs text-slate2 inline-flex items-center gap-1"><Ic name="clock" size={13}/>{job.window}</span>
                          {job.paidInAdvance && <Badge tone="green">Paid</Badge>}
                          {isDone && <span className="text-xs text-emerald-600 font-semibold inline-flex items-center gap-1"><Ic name="check" size={13}/>{job.doneAt}</span>}
                          {isNoAnswer && <Badge tone="rose">No answer</Badge>}
                        </div>
                        <div className="font-semibold text-ink mt-1">{fullName(c)}</div>
                        <div className="text-sm text-slate2">{c.addr}</div>
                        {job.type==='delivery'
                          ? <div className="text-xs text-slate2 mt-0.5 inline-flex items-center gap-1"><Ic name="box" size={13}/>{job.packaging}</div>
                          : job.returnDate && <div className="text-xs text-slate2 mt-0.5">Return {fmtDate(job.returnDate)}</div>}
                        {job.instructions && <div className="text-xs text-rose-700 mt-1 bg-rose-50 rounded-lg px-2 py-1 inline-flex items-start gap-1"><Ic name="note" size={13}/><span>{job.instructions}</span></div>}
                      </div>
                    </div>
                    {!resolved && <Btn kind={isNext?(job.type==='collection'?'rose':'primary'):'subtle'} onClick={()=>setOpenId(job.id)} className="!py-1.5 !px-3 shrink-0">Open</Btn>}
                  </div>
                </div>
              );
            })}
          </div>
        </>}

        {openJob && (openJob.type==='collection'
          ? <CollectionForm job={openJob} rates={rates} onBack={()=>setOpenId(null)} onConfirm={completeCollection} onNoAnswer={markNoAnswer} />
          : <DeliveryView job={openJob} onBack={()=>setOpenId(null)} onConfirm={completeDelivery} onNoAnswer={markNoAnswer} />)}
      </div>
    </div>
  );
}

function CollectionForm({ job, rates, onBack, onConfirm, onNoAnswer }) {

  const [shirtCount,setShirtCount]=useState('');

  const [firstOrder,setFirstOrder]=useState(false);
  const [notes,setNotes]=useState('');
  const [confirmed,setConfirmed]=useState(false);

  const isShirts = serviceKey==='shirts';
  const totalWeight = useMemo(()=>sum(bags.map(b=>b.weight)), [bags]);
  const result = useMemo(()=>calcPrice(rates, isShirts?{}:{[serviceKey]:totalWeight},{},firstOrder), [rates,serviceKey,isShirts,totalWeight,firstOrder]);
  const wsvc = rates.weight.find(r=>r.key===serviceKey);
  const svcLabel = isShirts ? `Shirt service (${shirtType==='io'?'iron only':'wash & iron'})` : wsvc.label.replace(/ \(.*\)/,'');

    paymentMethod:'On delivery', customerNotes:notes, extras, needsPricing, shirtCount:isShirts?shirtCount:'' };

  const addBag=()=>setBags(b=>[...b,{id:(b[b.length-1]?.id||0)+1,weight:''}]);
  const rmBag=id=>setBags(b=>b.length>1?b.filter(x=>x.id!==id):b);
  const setBagW=(id,v)=>setBags(b=>b.map(x=>x.id===id?{...x,weight:v}:x));
  const toggleExtra=x=>setExtras(e=>e.includes(x)?e.filter(y=>y!==x):[...e,x]);

  if (confirmed) return (

      <div className="bg-teal-light text-teal-dark rounded-xl p-3 mt-3 text-sm flex items-center justify-center gap-2"><Ic name="mail" size={16}/>{needsPricing?'Provisional':'Receipt'} email sent to {c.email}</div>
      <div className="mt-6"><Btn icon="right" onClick={()=>onConfirm(job,confirmData)}>Back to run</Btn></div>
    </div>
  );

  return (
    <div>
      <button onClick={onBack} className="text-slate2 text-sm mb-3 inline-flex items-center gap-1"><Ic name="left" size={15}/>Back to run</button>
      <div className="bg-white card rounded-2xl p-5">
        <div className="flex items-start justify-between gap-2">
          <div><TypeBadge type="collection"/>

            <p className="text-sm text-slate2">{c.addr}</p>
            {job.returnDate && <p className="text-xs text-slate2 mt-0.5">Return {fmtDate(job.returnDate)}</p>}
          </div>
          <div className="flex flex-col gap-2 shrink-0"><DirectionsBtn addr={c.addr}/><CallBtn mob={c.mob}/></div>
        </div>
        {job.instructions && <div className="text-xs text-rose-700 mt-3 bg-rose-50 rounded-lg px-2 py-1.5 inline-flex items-start gap-1"><Ic name="note" size={14}/><span>Boss note: {job.instructions}</span></div>}

        <hr className="my-4 border-gray-100"/>
        <h4 className="font-bold text-ink text-sm mb-1">Service</h4>
        <div className="space-y-1">
          {rates.weight.map(r=>(
            <label key={r.key} className="flex items-center gap-2 text-sm text-ink">
              <input type="radio" name="svc" checked={serviceKey===r.key} onChange={()=>setServiceKey(r.key)} className="accent-teal"/>

            <div className="text-sm font-semibold text-ink">Shirts — counted at the shop</div>
            <p className="text-xs text-amber-700 mb-2">No need to count or price on the doorstep. Just take the bag; the shop confirms the count.</p>
            <div className="space-y-1">
              <label className="flex items-center gap-2 text-sm text-ink"><input type="radio" name="shirt" checked={shirtType==='io'} onChange={()=>setShirtType('io')} className="accent-teal"/>Iron only <span className="text-slate2">(£2.00/shirt)</span></label>
              <label className="flex items-center gap-2 text-sm text-ink"><input type="radio" name="shirt" checked={shirtType==='wi'} onChange={()=>setShirtType('wi')} className="accent-teal"/>Wash &amp; iron <span className="text-slate2">(£3.00/shirt)</span></label>
            </div>
            <div className="flex items-center gap-2 mt-2">
              <span className="text-sm text-slate2">Shirts (only if the customer gave a number)</span>
              <input type="number" min="0" step="1" value={shirtCount} onChange={e=>setShirtCount(e.target.value)} className={inputCls+' !w-20 text-right'} placeholder="—"/>
            </div>
          </div>
        </>}

        <h4 className="font-bold text-ink text-sm mt-4 mb-1">Extras in the bag <span className="text-slate2 font-normal">— priced at the shop</span></h4>
        <p className="text-xs text-slate2 mb-2">Just tick what the customer says is in there. No need to unpack or price it at the door.</p>
        <div className="flex flex-wrap gap-2">
          {EXTRA_TYPES.map(x=>(
            <button key={x} onClick={()=>toggleExtra(x)}
              className={`inline-flex items-center gap-1 px-3 py-1.5 rounded-full text-xs font-semibold border transition ${extras.includes(x)?'bg-amber-50 border-amber-300 text-amber-700':'bg-white border-gray-200 text-slate2 hover:border-gray-300'}`}>
              {extras.includes(x)&&<Ic name="check" size={13}/>}{x}</button>))}
        </div>
        {needsPricing && <div className="text-xs text-amber-700 bg-amber-50 rounded-lg px-2 py-1.5 mt-2 inline-flex items-center gap-1"><Ic name="alert" size={14}/>{isShirts?'Shirts and any extras are counted & priced at the shop.':'Price below is provisional — shop finalises it.'}</div>}

        <label className="flex items-center gap-2 mt-3 text-sm text-ink">
          <input type="checkbox" checked={firstOrder} onChange={e=>setFirstOrder(e.target.checked)} className="accent-teal"/> Apply first-order discount (10%)</label>

        <h4 className="font-bold text-ink text-sm mt-4 mb-1">Customer notes <span className="text-slate2 font-normal">(seen by boss &amp; store team)</span></h4>
        <textarea value={notes} onChange={e=>setNotes(e.target.value)} rows="2" placeholder="e.g. stain on white shirt collar, handle silk gently…" className={inputCls}></textarea>

        <div className="bg-gray-50 rounded-xl p-4 mt-4">
          {isShirts
            ? <p className="text-slate2 text-sm">Shirts are counted and priced at the shop.</p>
            : result.lines.length===0
              ? <p className="text-slate2 text-sm">Enter bag weights to calculate the price…</p>
              : <div className="space-y-1">
                  {result.lines.map((l,i)=>(<div key={i} className="flex justify-between text-sm text-slate2"><span>{l.label}</span><span>{gbp(l.amt)}</span></div>))}

                  {result.belowMin && <div className="flex justify-between text-xs text-amber-600"><span>Below {gbp(rates.minOrder)} minimum — rounded up</span><span></span></div>}

          <div className="flex justify-between items-center mt-2 pt-2 border-t border-gray-200">
            <span className="font-bold text-ink">{(isShirts||needsPricing)?'Provisional total':'Total to charge'}</span>

        <button onClick={()=>onNoAnswer(job)} className="w-full mt-2 border-2 border-rose-200 bg-white text-rose-600 rounded-xl py-2 text-sm font-semibold inline-flex items-center justify-center gap-1.5 hover:bg-rose-50 transition"><Ic name="alert" size={15}/>No answer — reschedule</button>

/* =================================================================== */
/*  ORDER TIMELINE + DETAIL / PRICING MODAL                            */
/* =================================================================== */
const LIFECYCLE = ['Pending Collection','Collected','In Shop','Ready','Out for delivery','Delivered'];
const statusToStep = s => ({ 'Pending Collection':0,'No answer':0,'Booked':0,'Needs pricing':1,'Collected':1,'In Shop':2,'In progress':2,'Ready':3,'Out for delivery':4,'Delivered':5 }[s] ?? 1);
// generic "Mark next" only up to Ready — after Ready the shop dispatches (Send out for delivery)
const NEXT_STATUS = { 'Collected':'In Shop', 'In Shop':'Ready' };
function statusTone(s){ return s==='Ready'?'green':s==='In Shop'?'amber':s==='Collected'?'teal':s==='Out for delivery'?'violet':s==='Needs pricing'?'rose':s==='No answer'?'rose':s==='Pending Collection'?'slate':'grey'; }

function Timeline({ status }) {
  const active = statusToStep(status);
  return (
    <div className="mt-1">
      {LIFECYCLE.map((step,i)=>{
        const doneStep = i<active, cur = i===active;
        return (
          <div key={step} className="flex gap-3">
            <div className="flex flex-col items-center">
              <div className={`w-3.5 h-3.5 rounded-full border-2 ${cur?'bg-teal border-teal':doneStep?'bg-teal-dark border-teal-dark':'bg-white border-gray-300'}`}></div>
              {i<LIFECYCLE.length-1 && <div className={`w-0.5 flex-1 min-h-[18px] ${doneStep?'bg-teal-dark':'bg-gray-200'}`}></div>}
            </div>
            <div className={`text-sm pb-2 ${cur?'text-ink font-semibold':doneStep?'text-slate2':'text-gray-300'}`}>{step}
              {cur && status==='Needs pricing' && <span className="ml-2"><Badge tone="rose">Needs pricing</Badge></span>}</div>
          </div>);
      })}
    </div>
  );
}

function OrderModal({ order, rates, onClose, onSave, addAudit, onDelete, onDispatch, jobs, drivers, user }) {
  const c = custById(order.customerId);
  const driverStaff = (drivers||[]).filter(d=>hasRole(d,'driver'));
  const actor = (user&&user.name) || 'Someone';
  const assignedJob = (jobs||[]).find(j=>j.orderId===order.id);
  const assignedDriver = assignedJob && (drivers||[]).find(d=>d.id===assignedJob.driverId);
  const [pricing,setPricing]=useState(order.needsPricing);
  const [added,setAdded]=useState(order.addedItems||{});
  const [dispDriver,setDispDriver]=useState((driverStaff[0]&&driverStaff[0].id)||'');
  const [dispWindow,setDispWindow]=useState('18:00–19:00 (evening)');
  const groups = useMemo(()=>{ const g={}; rates.items.forEach(r=>{(g[r.group]=g[r.group]||[]).push(r)}); return g; },[rates]);
  const calc = useMemo(()=>orderTotal(rates, order.weightCharge, added, order.firstOrder), [rates,order,added]);

  const save = () => {
    onSave(order.id, { addedItems:added, amount:calc.charged, needsPricing:false,
      status: order.status==='Needs pricing'?'In Shop':order.status });
    addAudit(`${actor} priced ${fullName(c)}: ${gbp(order.initialAmount)} → ${gbp(calc.charged)}`);
    onClose();
  };
  const advance = () => { const ns=NEXT_STATUS[order.status]; if(!ns) return;
    onSave(order.id, { status:ns }); addAudit(`${actor} marked ${fullName(c)}'s order ${ns}`); };
  const dispatch = () => { if(!dispDriver) return; onDispatch(order, dispDriver, dispWindow); onClose(); };

  return (
    <div className="fixed inset-0 bg-black/40 flex items-center justify-center p-4 z-50" onClick={onClose}>
      <div className="bg-white rounded-2xl w-full max-w-2xl max-h-[92vh] overflow-y-auto" onClick={e=>e.stopPropagation()}>
        <div className="flex items-center justify-between px-5 py-4 border-b border-gray-100 sticky top-0 bg-white">
          <div><h3 className="text-lg font-bold text-ink">{fullName(c)}</h3><p className="text-sm text-slate2">{c.addr}</p></div>
          <button onClick={onClose} className="text-slate2 hover:text-ink"><Ic name="close" size={20}/></button>
        </div>
        <div className="p-5 grid md:grid-cols-2 gap-5">
          <div>
            <h4 className="font-bold text-ink text-sm mb-2">Order details</h4>
            <div className="text-sm space-y-1.5">
              <Row k="Services" v={order.services.join(', ')}/>
              {order.extras.length>0 && <Row k="Extras" v={<span className="text-amber-700">{order.extras.join(', ')}</span>}/>}
              <Row k="Bags" v={order.bagsCount>0?`${order.bagsCount} · ${order.bagWeights.join('+')}kg = ${order.weight}kg`:'—'}/>
              <Row k="Packaging" v={order.packaging}/>
              {assignedDriver && <Row k="Driver" v={<span className="inline-flex items-center gap-1"><Ic name="truck" size={13}/>{assignedDriver.name}</span>}/>}
              <Row k="Collected" v={order.collectedDate?`${fmtDate(order.collectedDate)} · ${order.collectedAt}`:'Not yet collected'}/>
              <Row k="Deliver by" v={fmtDate(order.dueDate)}/>
              <Row k="Payment" v={order.paidInAdvance?'Paid in advance':(order.paymentMethod==='—'?'—':order.paymentMethod)}/>
              <Row k="Price" v={order.status==='Pending Collection'?'—':<span className="font-bold text-ink">{gbp(order.amount)}{order.needsPricing&&<span className="text-rose-500 font-normal"> (provisional)</span>}</span>}/>
            </div>
            {order.notes && <div className="text-xs text-ink mt-3 bg-amber-50 border border-amber-100 rounded-lg px-2 py-1.5 flex items-start gap-1"><Ic name="note" size={14}/><span>{order.notes}</span></div>}
            <h4 className="font-bold text-ink text-sm mt-5 mb-1">Progress</h4>
            <Timeline status={order.status}/>
            {order.status==='Pending Collection' &&
              <p className="text-xs text-slate2 mt-2 inline-flex items-center gap-1"><Ic name="clock" size={14}/>Awaiting driver collection.</p>}
            {order.status==='No answer' &&
              <p className="text-xs text-rose-600 mt-2 inline-flex items-center gap-1"><Ic name="alert" size={14}/>No answer at the door — needs rescheduling.</p>}
            {order.status==='Out for delivery' &&
              <p className="text-xs text-violet-600 mt-2 inline-flex items-center gap-1"><Ic name="truck" size={14}/>On {assignedDriver?assignedDriver.name+"’s":'a driver’s'} run — delivers when confirmed.</p>}
            {order.status==='Delivered' &&
              <p className="text-xs text-emerald-600 mt-2 inline-flex items-center gap-1"><Ic name="check" size={14}/>Delivered.</p>}
            {order.needsPricing &&
              <p className="text-xs text-rose-600 mt-2 inline-flex items-center gap-1"><Ic name="alert" size={14}/>Price the extras before advancing.</p>}
            {NEXT_STATUS[order.status] && !order.needsPricing &&
              <Btn kind="dark" icon="right" className="mt-3 w-full" onClick={advance}>Mark {NEXT_STATUS[order.status]}</Btn>}
            {order.status==='Ready' && onDispatch && <div className="mt-3 bg-violet-50 border border-violet-100 rounded-xl p-3">
              <div className="text-xs font-semibold text-violet-700 mb-1.5 inline-flex items-center gap-1"><Ic name="truck" size={14}/>Send out for delivery</div>
              <div className="grid grid-cols-2 gap-2">
                <select value={dispDriver} onChange={e=>setDispDriver(e.target.value)} className={inputCls+' !py-1.5'}>
                  {driverStaff.map(d=><option key={d.id} value={d.id}>{d.name}</option>)}</select>
                <select value={dispWindow} onChange={e=>setDispWindow(e.target.value)} className={inputCls+' !py-1.5'}>
                  {TIME_WINDOWS.map(t=><option key={t}>{t}</option>)}</select>
              </div>
              <Btn kind="primary" icon="truck" className="w-full mt-2" onClick={dispatch}>Add to driver’s run</Btn>
            </div>}
          </div>

          <div>
            <div className="flex items-center justify-between mb-2">
              <h4 className="font-bold text-ink text-sm">Pricing</h4>

            {!pricing
              ? <div>
                  <div className="bg-gray-50 rounded-xl p-3 text-sm space-y-1">
                    {order.weightCharge>0 && <div className="flex justify-between text-slate2"><span>{order.services[0]||'Weight-based'} ({order.weight}kg)</span><span>{gbp(order.weightCharge)}</span></div>}
                    {calc.lines.map((l,i)=>(<div key={i} className="flex justify-between text-slate2"><span>{l.label}</span><span>{gbp(l.amt)}</span></div>))}
                    {calc.discount>0 && <div className="flex justify-between text-emerald-600"><span>First-order discount</span><span>−{gbp(calc.discount)}</span></div>}
                    {order.weightCharge===0 && calc.lines.length===0 && <div className="text-slate2">Nothing priced yet.</div>}
                    <div className="flex justify-between items-center pt-1.5 border-t border-gray-200"><span className="font-bold text-ink">Total</span><span className="font-extrabold text-ink">{gbp(order.amount)}</span></div>
                  </div>
                  <p className="text-xs text-slate2 mt-2">{calc.lines.length>0?'Extras added at the shop are listed above. ':''}Tap <b>Amend price</b> to add or change dry cleaning, bedding or repairs.</p>
                </div>
              : <>
                  <div className="bg-gray-50 rounded-xl p-3 text-sm mb-3">
                    <div className="flex justify-between text-slate2"><span>Weight-based ({order.services[0]})</span><span>{gbp(order.weightCharge)}</span></div>
                  </div>
                  <div className="max-h-56 overflow-y-auto pr-1">
                    {Object.entries(groups).map(([g,list])=>(
                      <div key={g} className="mb-2">
                        <div className="text-[11px] font-semibold text-teal-dark uppercase tracking-wide mb-1">{g}</div>
                        {list.map(r=>(
                          <div key={r.key} className="flex items-center justify-between gap-2 py-0.5">
                            <span className="text-sm text-ink">{r.label.replace(/^Dry clean — /,'')} <span className="text-slate2">{gbp(r.price)}</span></span>
                            <input type="number" min="0" step="1" value={added[r.key]||''} onChange={e=>setAdded({...added,[r.key]:e.target.value})} className={inputCls+' !w-16 text-right !py-1'} placeholder="0"/>
                          </div>))}
                      </div>))}
                  </div>
                  <div className="bg-teal-light rounded-xl p-3 mt-2">
                    {calc.lines.map((l,i)=>(<div key={i} className="flex justify-between text-sm text-teal-dark"><span>{l.label}</span><span>{gbp(l.amt)}</span></div>))}
                    <div className="flex justify-between items-center mt-1 pt-1 border-t border-teal/30">
                      <span className="font-bold text-ink">New total</span><span className="text-xl font-extrabold text-teal-dark">{gbp(calc.charged)}</span></div>
                  </div>
                  <Btn kind="primary" icon="check" className="w-full mt-3" onClick={save}>Save &amp; notify customer</Btn>
                  <p className="text-[11px] text-slate2 text-center mt-1.5">Logged to the audit trail; customer emailed the updated total.</p>
                </>}
          </div>
        </div>
        {onDelete && mayDelete(user) && <div className="px-5 pb-5">
          <button onClick={()=>{ if(window.confirm(`Delete this order for ${fullName(c)}? This can’t be undone.`)){ onDelete(order.id); onClose(); } }}
            className="w-full border-2 border-rose-200 bg-white text-rose-600 rounded-xl py-2 text-sm font-semibold inline-flex items-center justify-center gap-1.5 hover:bg-rose-50 transition">
            <Ic name="trash" size={15}/>Delete this order</button>
        </div>}
      </div>
    </div>
  );
}
function Row({ k, v }) { return <div className="flex justify-between gap-4"><span className="text-slate2">{k}</span><span className="text-ink text-right">{v}</span></div>; }

function StoreLogin({ go, onLogin }) {
  const [pin,setPin]=useState(''); const [err,setErr]=useState('');
  const submit=()=>{ if(pin!=='2222'){setErr('Incorrect PIN (hint: 2222)');return;} onLogin(); };
  return (
    <LoginCard go={go} title="Store team sign in" sub="Shop-floor view of what's in and going out.">
      <Field label="PIN"><input value={pin} onChange={e=>{setPin(e.target.value);setErr('')}} type="password" placeholder="2222"
        className={inputCls+' mt-1'} onKeyDown={e=>e.key==='Enter'&&submit()} /></Field>
      {err && <p className="text-rose-500 text-xs mt-2">{err}</p>}
      <Btn onClick={submit} className="w-full mt-4">Log in</Btn>
    </LoginCard>
  );
}
function StoreApp({ go, orders, rates, updateOrder, addAudit, deleteOrder, jobs, drivers, onDispatch, user }) {
  const [scope,setScope]=useState('today');
  const [sel,setSel]=useState(null);
  const list = useMemo(()=>{
    const inShop = o => ['Collected','Needs pricing','In Shop','Ready'].includes(o.status); // garments physically in the shop
    const f = orders.filter(o => inShop(o) && (scope==='today' ? o.dueDate===TODAY : withinWeek(o.dueDate)));
    return [...f].sort((a,b)=> a.dueDate.localeCompare(b.dueDate) || (a.collectedAt||'').localeCompare(b.collectedAt||''));
  }, [orders,scope]);

  const printList = () => {
    const itemLabel = k => { const r=rates.items.find(x=>x.key===k); return r ? r.label.replace(/^Dry clean — /,'') : k; };
    const addedStr = o => Object.entries(o.addedItems||{}).filter(([k,q])=>parseInt(q)>0).map(([k,q])=>`${itemLabel(k)} ×${q}`).join(', ');
    const rows = list.map(o=>{ const c=custById(o.customerId); const extra = addedStr(o) || (o.extras.length ? o.extras.join(', ') : '');
      return `<tr><td><b>${fmtDate(o.dueDate)}</b></td><td>${fullName(c)}<br><span class="a">${c.addr}</span></td>
        <td>${o.services.join(', ')}${extra?`<br><span class="r">+ ${extra}</span>`:''}</td>
        <td>${o.bagsCount} (${o.bagWeights.join('+')}kg) · ${o.weight}kg</td>
        <td>${gbp(o.amount)}${o.needsPricing?' <span class="r">(prov.)</span>':''}<br><span class="a">${o.paidInAdvance?'PAID':o.paymentMethod}</span></td>
        <td>${o.packaging}</td><td>${fmtDate(o.collectedDate)} ${o.collectedAt}</td><td>${o.status==='Needs pricing'?`<span class="r">${o.status}</span>`:o.status}</td><td>${o.notes||''}</td></tr>`; }).join('');
    const html = `<html><head><title>NELIS — ${scope==='today'?'Today':'This week'}</title>
      <style>body{font-family:Arial;padding:18px;color:#1f2a30}h1{font-size:16px;margin:0}.sub{color:#777;font-size:12px;margin:2px 0 12px}
      table{width:100%;border-collapse:collapse;font-size:11px}th{background:#3AAFCB;color:#fff;text-align:left;padding:5px 6px}
      td{border-bottom:1px solid #ddd;padding:5px 6px;vertical-align:top}.a{color:#888;font-size:10px}.r{color:#dc2626;font-weight:bold}@media print{@page{size:landscape;margin:10mm}}</style></head>
      <body><h1>NEL Ironing Service — Production list</h1><div class="sub">${scope==='today'?'Due today':'Due this week'} · printed ${fmtDate(TODAY)} · ${list.length} order(s)</div>
      <table><thead><tr><th>Due</th><th>Customer</th><th>Services</th><th>Bags / weight</th><th>Price</th><th>Pack</th><th>Collected</th><th>Status</th><th>Notes</th></tr></thead>
      <tbody>${rows}</tbody></table></body></html>`;
    const w = window.open('','_blank'); if(!w){alert('Please allow pop-ups to print the list.');return;}
    w.document.write(html); w.document.close(); w.focus(); setTimeout(()=>w.print(),300);
  };

  return (
    <div className="min-h-screen">
      <TopBar left={
        <div className="flex items-center gap-2">
          {user && PORTALS.filter(p=>hasRole(user,p.role)).length>1 && <button onClick={()=>go('picker')} title="Back to portals" className="w-8 h-8 rounded-lg border border-gray-200 flex items-center justify-center text-slate2 hover:bg-gray-50"><Ic name="left" size={18}/></button>}
          <Logo h={26}/></div>} right={
        <div className="flex items-center gap-2"><span className="text-sm text-ink font-semibold hidden sm:inline">{user?user.name:'Store team'}</span>
          {user && PORTALS.filter(p=>hasRole(user,p.role)).length>1 && <Btn kind="ghost" icon="layers" onClick={()=>go('picker')} className="!py-1.5 !px-3">Portals</Btn>}
          <Btn kind="ghost" icon="logout" onClick={()=>go('logout')} className="!py-1.5 !px-3">Log out</Btn></div>} />
      <div className="max-w-5xl mx-auto p-4">
        <div className="flex items-center justify-between mb-1 flex-wrap gap-2">
          <h2 className="text-xl font-extrabold text-ink">Production list</h2>
          <div className="flex items-center gap-2">
            <div className="bg-white rounded-xl p-1 card flex">
              {[['today','Today'],['week','This week']].map(([k,l])=>(
                <button key={k} onClick={()=>setScope(k)} className={`px-3 py-1.5 rounded-lg text-sm font-semibold ${scope===k?'bg-teal text-white':'text-slate2'}`}>{l}</button>))}
            </div>
            <Btn kind="ghost" icon="printer" onClick={printList}>Print / PDF</Btn>
          </div>
        </div>
        <p className="text-slate2 text-sm mb-4">Sorted by soonest due first, so you know which bags to deal with first. Tap an order for full details and to price extras.</p>

        {list.length===0 ? <div className="bg-white card rounded-2xl p-8 text-center text-slate2">Nothing due {scope==='today'?'today':'this week'}.</div>
        : <div className="space-y-3">
            {list.map(o=>{ const c=custById(o.customerId); const dueToday=o.dueDate===TODAY;
              return (
                <button key={o.id} onClick={()=>setSel(o)} className={`w-full text-left bg-white card rounded-2xl p-4 border-l-4 hover:ring-2 hover:ring-teal/40 transition ${o.needsPricing?'border-rose-400':dueToday?'border-teal':'border-gray-200'}`}>
                  <div className="flex flex-wrap items-start justify-between gap-3">
                    <div className="min-w-[180px]">
                      <div className="flex items-center gap-2 flex-wrap">
                        <Badge tone={dueToday?'teal':'grey'}>Due {fmtDate(o.dueDate)}</Badge>
                        <Badge tone={statusTone(o.status)}>{o.status}</Badge>
                        {o.paidInAdvance && <Badge tone="green">Paid</Badge>}
                      </div>
                      <div className="font-semibold text-ink mt-1.5">{fullName(c)}</div>
                      <div className="text-sm text-slate2">{c.addr}</div>
                      {o.extras.length>0 && <div className="text-xs text-amber-700 mt-1 inline-flex items-center gap-1"><Ic name="alert" size={13}/>To price: {o.extras.join(', ')}</div>}
                    </div>
                    <div className="text-sm grid grid-cols-2 gap-x-6 gap-y-0.5">
                      <span className="text-slate2">Services</span><span className="text-ink text-right">{o.services.join(', ')}</span>
                      <span className="text-slate2">Bags</span><span className="text-ink text-right">{o.bagsCount} · {o.weight}kg</span>
                      <span className="text-slate2">Price</span><span className="text-ink text-right">{gbp(o.amount)}{o.needsPricing?' (prov.)':''}</span>
                      <span className="text-slate2">Collected</span><span className="text-ink text-right">{fmtDate(o.collectedDate)} · {o.collectedAt}</span>
                    </div>
                  </div>
                  {o.notes && <div className="text-xs text-ink mt-2 bg-amber-50 border border-amber-100 rounded-lg px-2 py-1 inline-flex items-start gap-1"><Ic name="note" size={13}/><span>{o.notes}</span></div>}
                </button>);
            })}
          </div>}
      </div>
      {sel && <OrderModal order={orders.find(o=>o.id===sel.id)||sel} rates={rates} onClose={()=>setSel(null)} onSave={updateOrder} addAudit={addAudit} onDelete={deleteOrder} onDispatch={onDispatch} jobs={jobs} drivers={drivers} user={user}/>}
    </div>
  );
}

function AdminLogin({ go, onLogin }) {
  const [pin,setPin]=useState(''); const [err,setErr]=useState('');
  const submit=()=>{ if(pin!=='0000'){setErr('Incorrect PIN (hint: 0000)');return;} onLogin(); };
  return (
    <LoginCard go={go} title="Admin sign in" sub="Boss access to all operations.">
      <Field label="PIN"><input value={pin} onChange={e=>{setPin(e.target.value);setErr('')}} type="password" placeholder="0000"
        className={inputCls+' mt-1'} onKeyDown={e=>e.key==='Enter'&&submit()} /></Field>
      {err && <p className="text-rose-500 text-xs mt-2">{err}</p>}
      <Btn onClick={submit} className="w-full mt-4">Log in</Btn>
    </LoginCard>

}
function AdminApp({ go, jobs, setJobs, rates, setRates, audit, drivers, setDrivers, deleteDriver, orders, addJob, updateOrder, addAudit, deleteJob, deleteOrder, dispatchDelivery, customers, addCustomer, updateCustomer, deleteCustomer, user }) {
  const [tab,setTab]=useState('overview');
  const [intake,setIntake]=useState(false);
  const [ordersFilter,setOrdersFilter]=useState('all');
  const goStat = which => {
    if (which==='customers') setTab('customers');
    else if (which==='jobs') setTab('logistics');
    else if (which==='pricing') { setOrdersFilter('needsPricing'); setTab('orders'); }
  };
  const tabs=[['overview','chart','Overview'],['customers','users','Customers'],['orders','layers','Orders'],
    ['pricing','tag','Pricing'],['staff','user','Staff'],['logistics','pin','Logistics']];
  return (
    <div className="min-h-screen">
      <TopBar left={
        <div className="flex items-center gap-2">
          {user && PORTALS.filter(p=>hasRole(user,p.role)).length>1 && <button onClick={()=>go('picker')} title="Back to portals" className="w-8 h-8 rounded-lg border border-gray-200 flex items-center justify-center text-slate2 hover:bg-gray-50"><Ic name="left" size={18}/></button>}
          <Logo h={26}/></div>} right={
        <div className="flex items-center gap-2">
          <span className="text-sm text-ink font-semibold hidden sm:inline">{user?user.name:'Boss'}</span>
          <Btn kind="rose" icon="plus" onClick={()=>setIntake(true)} className="!py-1.5 !px-3">New job</Btn>
          {user && PORTALS.filter(p=>hasRole(user,p.role)).length>1 && <Btn kind="ghost" icon="layers" onClick={()=>go('picker')} className="!py-1.5 !px-3">Portals</Btn>}
          <Btn kind="ghost" icon="logout" onClick={()=>go('logout')} className="!py-1.5 !px-3">Log out</Btn></div>} />
      <div className="max-w-5xl mx-auto p-4">
        <div className="flex flex-wrap gap-1 mb-4 bg-white rounded-2xl p-1 card">
          {tabs.map(([k,ic,l])=>(<button key={k} onClick={()=>{ setTab(k); if(k==='orders') setOrdersFilter('all'); }}
            className={`px-3.5 py-2 rounded-xl text-sm font-semibold whitespace-nowrap inline-flex items-center gap-1.5 ${tab===k?'bg-teal text-white':'text-slate2 hover:bg-gray-50'}`}><Ic name={ic} size={15}/>{l}</button>))}
        </div>
        {tab==='overview'  && <Overview jobs={jobs} orders={orders} audit={audit} onNew={()=>setIntake(true)} goStat={goStat}/>}
        {tab==='customers' && <Customers customers={customers} addCustomer={addCustomer} updateCustomer={updateCustomer} deleteCustomer={deleteCustomer} user={user}/>}
        {tab==='orders'    && <Orders orders={orders} rates={rates} updateOrder={updateOrder} addAudit={addAudit} filter={ordersFilter} onClearFilter={()=>setOrdersFilter('all')} deleteOrder={deleteOrder} jobs={jobs} drivers={drivers} onDispatch={dispatchDelivery} user={user}/>}
        {tab==='pricing'   && <Pricing rates={rates} setRates={setRates} canDelete={mayDelete(user)}/>}
        {tab==='staff'     && <StaffAdmin drivers={drivers} setDrivers={setDrivers} deleteDriver={deleteDriver} user={user}/>}
        {tab==='logistics' && <Logistics jobs={jobs} setJobs={setJobs} drivers={drivers} onNew={()=>setIntake(true)} deleteJob={deleteJob} customers={customers} user={user}/>}
      </div>
      {intake && <IntakeModal drivers={drivers} onClose={()=>setIntake(false)} onCreate={addJob} customers={customers} addCustomer={addCustomer}/>}
    </div>
  );
}

function IntakeModal({ drivers, onClose, onCreate, customers, addCustomer }) {
  const driverStaff = (drivers||[]).filter(d=>hasRole(d,'driver'));
  const [q,setQ]=useState(''); const [customerId,setCustomerId]=useState(null); const [addingCust,setAddingCust]=useState(false);
  const [type,setType]=useState('collection'); const [driverId,setDriverId]=useState((driverStaff[0]||{}).id);
  const [returnDate,setReturnDate]=useState(addDays(TODAY,2)); const [packaging,setPackaging]=useState('Hanging');
  const [instructions,setInstructions]=useState(''); const [paid,setPaid]=useState(false); const [window_,setWindow]=useState('16:00–17:00');
  const matches = q.trim().length<1 ? [] : (customers||[]).filter(c=>(fullName(c)+' '+c.addr).toLowerCase().includes(q.toLowerCase())).slice(0,6);
  const chosen = customerId ? custById(customerId) : null;
  const create=()=>{ if(!customerId)return;
    onCreate({ id:uuid(), driverId, type, customerId, window:window_, status:'pending', packaging, instructions,
      returnDate: type==='collection'?returnDate:undefined, paidInAdvance:paid,
      ...(type==='delivery'?{bags:1,weight:0,amount:0,service:'—',paymentMethod:'Cash'}:{}) }); onClose(); };
  return (
    <div className="fixed inset-0 bg-black/40 flex items-center justify-center p-4 z-50" onClick={onClose}>
      <div className="bg-white rounded-2xl p-6 w-full max-w-md max-h-[92vh] overflow-y-auto" onClick={e=>e.stopPropagation()}>
        <div className="flex items-center justify-between mb-1">
          <h3 className="text-lg font-bold text-ink">New job from WhatsApp / SMS</h3>
          <button onClick={onClose} className="text-slate2 hover:text-ink"><Ic name="close" size={20}/></button>
        </div>
        <p className="text-xs text-slate2 mb-4">Log a booking so it appears in the driver's run. Price is captured on collection — no need to enter it here.</p>
        <Field label="Find customer by name or address">
          <div className="relative mt-1">
            <span className="absolute left-3 top-1/2 -translate-y-1/2 text-slate2"><Ic name="search" size={16}/></span>
            <input value={q} onChange={e=>{setQ(e.target.value);setCustomerId(null);}} placeholder="e.g. Myrtle Rd or Grace" className={inputCls+' pl-9'} />
          </div>
        </Field>
        {!chosen && matches.map(c=>(
          <button key={c.id} onClick={()=>{setCustomerId(c.id);setQ(fullName(c));}} className="w-full text-left px-3 py-2 hover:bg-gray-50 border-b border-gray-100 text-sm">
            <div className="font-medium text-ink">{fullName(c)}</div><div className="text-slate2 text-xs">{c.addr}</div></button>))}
        {chosen && <div className="bg-teal-light rounded-xl px-3 py-2 mt-2 text-sm">
          <div className="font-semibold text-ink">{fullName(chosen)}</div><div className="text-slate2 text-xs">{chosen.addr} · {chosen.mob}</div></div>}
        {q.trim() && !chosen && matches.length===0 &&
          <button onClick={()=>setAddingCust(true)} className="w-full text-left mt-1 px-3 py-2 rounded-lg bg-teal-light text-teal-dark text-sm font-semibold inline-flex items-center gap-1.5"><Ic name="plus" size={15}/>Add “{q.trim()}” as a new customer</button>}
        {!chosen && q.trim()==='' &&
          <button onClick={()=>setAddingCust(true)} className="text-teal-dark text-xs font-semibold mt-1 inline-flex items-center gap-1"><Ic name="plus" size={13}/>New customer</button>}
        {addingCust && <AddCustomerModal initialName={q.trim()} onClose={(c)=>{ setAddingCust(false); if(c){ setCustomerId(c.id); setQ(fullName(c)); } }} onCreate={addCustomer}/>}
        <div className="grid grid-cols-2 gap-3 mt-4">
          <Field label="Type"><select value={type} onChange={e=>setType(e.target.value)} className={inputCls+' mt-1'}>
            <option value="collection">Collection</option><option value="delivery">Delivery</option></select></Field>
          <Field label="Assign driver"><select value={driverId} onChange={e=>setDriverId(e.target.value)} className={inputCls+' mt-1'}>
            {driverStaff.map(d=><option key={d.id} value={d.id}>{d.name}</option>)}</select></Field>
          {type==='collection' && <Field label="Return by"><input type="date" value={returnDate} onChange={e=>setReturnDate(e.target.value)} className={inputCls+' mt-1'}/></Field>}
          <Field label="Time window"><select value={window_} onChange={e=>setWindow(e.target.value)} className={inputCls+' mt-1'}>
            {TIME_WINDOWS.map(t=><option key={t}>{t}</option>)}</select></Field>
          <div className="col-span-2"><Field label="Packaging"><select value={packaging} onChange={e=>setPackaging(e.target.value)} className={inputCls+' mt-1'}>
            {PACKAGING.map(p=><option key={p}>{p}</option>)}</select></Field></div>
        </div>
        <div className="mt-3"><Field label="Delivery / collection instructions (shown to driver)">
          <textarea value={instructions} onChange={e=>setInstructions(e.target.value)} rows="2" placeholder="e.g. doesn't mind doorstep collection" className={inputCls+' mt-1'}></textarea></Field></div>
        <label className="flex items-center gap-2 mt-3 text-sm text-ink"><input type="checkbox" checked={paid} onChange={e=>setPaid(e.target.checked)} className="accent-teal"/> Paid in advance</label>
        <div className="flex gap-2 mt-5">
          <Btn kind="ghost" onClick={onClose} className="flex-1">Cancel</Btn>
          <Btn kind="rose" icon="plus" onClick={create} className="flex-1" {...(!customerId?{disabled:true}:{})}>Add to run</Btn>
        </div>
      </div>
    </div>
  );
}

function Stat({ label, value, onClick }) {
  const inner = <><div className="text-2xl font-extrabold text-ink">{value}</div>
    <div className="text-xs text-slate2 mt-0.5 inline-flex items-center gap-1">{label}{onClick&&<Ic name="right" size={12} className="text-teal-dark"/>}</div></>;
  return onClick
    ? <button onClick={onClick} className="bg-white card rounded-2xl p-4 text-left w-full hover:ring-2 hover:ring-teal/40 transition">{inner}</button>
    : <div className="bg-white card rounded-2xl p-4">{inner}</div>;
}
function Overview({ jobs, orders, audit, onNew, goStat }) {
  const done = jobs.filter(j=>j.status==='done');
  const revenue = done.reduce((s,j)=>s+(j.amount||0),0);
  const cols = jobs.filter(j=>j.type==='collection').length;
  const needp = orders.filter(o=>o.needsPricing).length;
  return (
    <div>
      <div className="grid grid-cols-2 sm:grid-cols-4 gap-3 mb-4">
        <Stat label="Customers" value={CUSTOMERS.length} onClick={()=>goStat('customers')}/>
        <Stat label="Jobs today" value={jobs.length} onClick={()=>goStat('jobs')}/>
        <Stat label="Collections / deliveries" value={`${cols} / ${jobs.length-cols}`} onClick={()=>goStat('jobs')}/>
        <Stat label="Awaiting shop pricing" value={needp} onClick={()=>goStat('pricing')}/>
      </div>
      <div className="bg-white card rounded-2xl p-4">
        <div className="flex items-center justify-between mb-2">
          <h3 className="font-bold text-ink">Audit trail</h3>

/* Free map — Leaflet + OpenStreetMap tiles. No API key, no billing account. */
function RouteMap({ jobs, drivers, filterDriver, customers }) {
  const elRef = useRef(null), mapRef = useRef(null), layerRef = useRef(null);

  useEffect(()=>{
    if (typeof L === 'undefined' || !elRef.current || mapRef.current) return;
    const map = L.map(elRef.current, { scrollWheelZoom:false }).setView([51.60,-0.01], 12);
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',
      { maxZoom:19, attribution:'&copy; OpenStreetMap contributors' }).addTo(map);
    mapRef.current = map;
    layerRef.current = L.layerGroup().addTo(map);
    return ()=>{ map.remove(); mapRef.current=null; layerRef.current=null; };
  },[]);

  useEffect(()=>{
    const map = mapRef.current, group = layerRef.current;
    if (!map || !group) return;
    group.clearLayers();
    const bounds = [[SHOP.lat,SHOP.lng]];
    const initials = n => (n||'').split(' ').filter(Boolean).map(w=>w[0]).join('').slice(0,2).toUpperCase();
    const shopIcon = L.divIcon({ className:'', iconSize:[30,30], iconAnchor:[15,15],
      html:`<div style="background:#1f2a30;width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.35)">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11l8-6 8 6"/><path d="M6 10v9h12v-9"/></svg></div>` });
    // stop pin: driver initials + driving order (e.g. "SO | 1")
    const stopIcon = (ini, seq, bg) => L.divIcon({ className:'', iconSize:[42,24], iconAnchor:[21,12],
      html:`<div style="background:${bg};color:#fff;height:24px;padding:0 7px;border-radius:12px;display:inline-flex;align-items:center;gap:3px;font:bold 11px Inter,Arial;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.35);white-space:nowrap">
        <span>${ini}</span><span style="opacity:.5">|</span><span>${seq}</span></div>` });

    L.marker([SHOP.lat,SHOP.lng],{icon:shopIcon})
      .bindPopup(`<b>${SHOP.name}</b><br>${SHOP.addr}<br><i>Start &amp; end of the round</i>`).addTo(group);

    drivers.forEach((d,di)=>{
      if (filterDriver!=='all' && filterDriver!==d.id) return;
      const ini = initials(d.name);
      const list = jobs.filter(j=>j.driverId===d.id).sort((a,b)=>a.seq-b.seq);
      const pts = [[SHOP.lat,SHOP.lng]];
      list.forEach(j=>{
        const c = custById(j.customerId);
        if (!c || c.lat==null) return;
        const resolved = j.status!=='pending';
        const bg = resolved ? '#9aa5ab' : (j.type==='collection' ? '#f43f5e' : '#3AAFCB');
        L.marker([c.lat,c.lng],{icon:stopIcon(ini, j.seq, bg)}).bindPopup(
          `<b>${fullName(c)}</b><br>${c.addr}<br>${j.type==='collection'?'Collection':'Delivery'} · ${j.window}` +
          `<br><i>${d.name}${resolved?' · done':''}</i>`).addTo(group);
        pts.push([c.lat,c.lng]); bounds.push([c.lat,c.lng]);
      });
      pts.push([SHOP.lat,SHOP.lng]);
      if (pts.length>2) L.polyline(pts,{ color: di===0?'#2b93ac':'#7c3aed', weight:3, opacity:.55, dashArray:'6,7' }).addTo(group);
    });
    if (bounds.length>1) map.fitBounds(bounds,{ padding:[35,35] });
  },[jobs,drivers,filterDriver,customers]);

  if (typeof L === 'undefined') return (
    <div className="h-40 rounded-2xl border border-gray-100 bg-gray-50 flex items-center justify-center text-sm text-slate2">
      Map needs an internet connection to load.</div>);
  return <div ref={elRef} style={{height:'340px'}} className="w-full rounded-2xl overflow-hidden border border-gray-100 z-0"/>;
}

function Logistics({ jobs, setJobs, drivers, onNew, deleteJob, customers, user }) {
  const driverStaff = drivers.filter(d=>hasRole(d,'driver'));
  const [mapDriver,setMapDriver]=useState('all');
  const [saving,setSaving]=useState(null);
  const [drag,setDrag]=useState(null);
  const targets = mapDriver==='all' ? driverStaff.map(d=>d.id) : [mapDriver];
  const roundMiles = useMemo(()=>totalMiles(jobs,targets), [jobs,mapDriver,drivers]);
  const noLoc = jobs.filter(j=>targets.includes(j.driverId) && j.status==='pending').filter(j=>{const c=custById(j.customerId); return !c||c.lat==null;}).length;
  const optimise = () => {
    const before = totalMiles(jobs,targets);
    let next = jobs; targets.forEach(did=>{ next = optimiseDriver(next,did); });
    const after = totalMiles(next,targets);
    setJobs(next); setSaving({before,after});
  };
  const move=(driverId,jobId,dir)=>setJobs(prev=>moveJob(prev,driverId,jobId,dir));
  const dropOnJob=(toDriverId,targetId)=>{ if(drag) setJobs(prev=>moveJobTo(prev,drag.jobId,toDriverId,targetId)); setDrag(null); };
  const dropOnColumn=(toDriverId)=>{ if(drag) setJobs(prev=>moveJobTo(prev,drag.jobId,toDriverId,null)); setDrag(null); };
  const reassign=(jobId,toDriverId)=>setJobs(prev=>moveJobTo(prev,jobId,toDriverId,null));
  return (
    <div>
      <div className="flex items-center justify-between mb-1 flex-wrap gap-2">
        <h3 className="font-bold text-ink">Logistics &amp; route planning</h3>
        <Btn kind="rose" icon="plus" onClick={onNew} className="!py-1.5 !px-3">New job</Btn>
      </div>
      <p className="text-xs text-slate2 mb-3">Each driver's collections + deliveries for today. Drag a card to reorder <b>or drop it on the other driver</b> to reassign — or use the <b>Move to</b> menu. Chevrons nudge within a driver. <span className="text-rose-500 font-semibold">Pink = collection</span>, white = delivery.</p>

      <div className="bg-white card rounded-2xl p-3 mb-4">
        <div className="flex items-center justify-between mb-2 flex-wrap gap-2">
          <h4 className="font-bold text-ink text-sm">Today’s stops on the map</h4>
          <div className="flex items-center gap-2 flex-wrap">
            <div className="flex items-center gap-1 bg-gray-50 rounded-xl p-1">
              {[['all','All drivers'],...driverStaff.map(d=>[d.id,d.name.split(' ')[0]])].map(([k,l])=>(
                <button key={k} onClick={()=>{setMapDriver(k);setSaving(null);}}
                  className={`px-2.5 py-1 rounded-lg text-xs font-semibold ${mapDriver===k?'bg-teal text-white':'text-slate2'}`}>{l}</button>))}
            </div>
            <Btn kind="primary" icon="pin" onClick={optimise} className="!py-1.5 !px-3 text-xs">Suggest best order</Btn>
          </div>
        </div>
        <RouteMap jobs={jobs} drivers={driverStaff} filterDriver={mapDriver} customers={customers}/>
        <div className="flex items-center justify-between gap-3 flex-wrap mt-2">
          <p className="text-[11px] text-slate2 flex-1 min-w-[220px]">
            <span className="text-rose-500 font-semibold">Pink = collection</span>, <span className="text-teal-dark font-semibold">blue = delivery</span>,
            grey = already done. Each pin shows the driver’s initials and driving order (e.g. SO | 1); the house marker is the shop (start &amp; end). Tap a pin for details.</p>
          <span className="text-xs font-bold text-ink whitespace-nowrap">Round: ~{roundMiles.toFixed(1)} miles</span>
        </div>
        {noLoc>0 && <div className="text-xs text-amber-600 mt-1 inline-flex items-center gap-1"><Ic name="info" size={13}/>{noLoc} stop{noLoc>1?'s':''} not on the map yet — finding location from the address…</div>}
        {saving && <div className={`text-xs rounded-lg px-2.5 py-1.5 mt-2 inline-flex items-center gap-1.5 ${saving.after < saving.before-0.05 ? 'bg-emerald-50 text-emerald-700':'bg-gray-50 text-slate2'}`}>
          <Ic name="check" size={14}/>{saving.after < saving.before-0.05
            ? `Reordered — about ${(saving.before-saving.after).toFixed(1)} miles shorter (${saving.before.toFixed(1)} → ${saving.after.toFixed(1)} miles).`
            : `Already in a good order — no shorter route found (${saving.before.toFixed(1)} miles).`}</div>}
      </div>
      <div className="grid md:grid-cols-2 gap-4">
        {driverStaff.map(d=>{
          const list=jobs.filter(j=>j.driverId===d.id).sort((a,b)=>a.seq-b.seq);
          const isDropTarget = drag && drag.fromDriverId!==d.id;
          return (
            <div key={d.id}
              onDragOver={e=>{ if(isDropTarget){ e.preventDefault(); e.currentTarget.classList.add('drag-over'); } }}
              onDragLeave={e=>e.currentTarget.classList.remove('drag-over')}
              onDrop={e=>{ e.currentTarget.classList.remove('drag-over'); dropOnColumn(d.id); }}
              className="bg-white card rounded-2xl p-4">
              <h4 className="font-bold text-ink text-sm mb-2 inline-flex items-center gap-1.5"><Ic name="truck" size={16}/>{d.name} <span className="text-slate2 font-normal">· {list.length} stops{list.filter(x=>x.status!=='pending').length?` · ${list.filter(x=>x.status!=='pending').length} done`:''}</span>
                {isDropTarget && <span className="text-teal-dark text-xs font-normal ml-1">— drop to reassign</span>}</h4>
              {list.length===0 ? <p className="text-sm text-slate2 border-2 border-dashed border-gray-200 rounded-xl p-4 text-center">No route assigned{isDropTarget?' — drop a job here':''}.</p> :
                <div className="space-y-2">
                  {list.map((j,idx)=>{ const c=custById(j.customerId); const done=j.status==='done', na=j.status==='no-answer', resolved=done||na;
                    return (
                      <div key={j.id} draggable onDragStart={()=>setDrag({fromDriverId:d.id,jobId:j.id})} onDragEnd={()=>setDrag(null)}
                        onDragOver={e=>{e.preventDefault(); e.stopPropagation(); e.currentTarget.classList.add('drag-over');}}
                        onDragLeave={e=>e.currentTarget.classList.remove('drag-over')}
                        onDrop={e=>{e.preventDefault(); e.stopPropagation(); e.currentTarget.classList.remove('drag-over'); dropOnJob(d.id,j.id);}}
                        className={`rounded-xl border px-2 py-2 cursor-move ${resolved?'opacity-60 bg-gray-50 border-gray-100':j.type==='collection'?'bg-rose-50/70 border-rose-100':'bg-white border-gray-100'}`}>
                        <div className="flex items-center gap-2">
                          <span className="text-gray-300"><Ic name="grip" size={16}/></span>
                          <span className={`w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold text-white shrink-0 ${resolved?'bg-gray-300':j.type==='collection'?'bg-rose-500':'bg-teal'}`}>{j.seq}</span>
                          <div className="flex-1 min-w-0">
                            <div className="flex items-center gap-1.5 flex-wrap"><TypeBadge type={j.type}/><span className="text-xs text-slate2">{j.window}</span>{done && <Badge tone="green">Done</Badge>}{na && <Badge tone="rose">No answer</Badge>}</div>
                            <div className="text-sm text-ink truncate">{fullName(c)}</div>
                            <div className="text-xs text-slate2 truncate">{c.addr}</div>
                          </div>
                          <div className="flex flex-col text-slate2">
                            <button onClick={()=>move(d.id,j.id,'up')} disabled={idx===0} className={idx===0?'text-gray-200':'hover:text-teal'}><Ic name="up" size={16}/></button>
                            <button onClick={()=>move(d.id,j.id,'down')} disabled={idx===list.length-1} className={idx===list.length-1?'text-gray-200':'hover:text-teal'}><Ic name="down" size={16}/></button>
                          </div>
                          {mayDelete(user) && <button onClick={()=>{ if(window.confirm(`Cancel this ${j.type} for ${fullName(c)}?`)) deleteJob(j); }}
                            className="text-gray-300 hover:text-rose-500 self-center" title="Cancel / delete this job"><Ic name="trash" size={16}/></button>}
                        </div>
                        {driverStaff.length>1 &&
                          <div className="flex items-center gap-1 mt-1.5 pl-8">
                            <span className="text-[11px] text-slate2">Move to:</span>
                            <select value={d.id} onChange={e=>reassign(j.id,e.target.value)} className="text-[11px] border border-gray-200 rounded-lg px-1 py-0.5 bg-white text-ink">
                              {driverStaff.map(dr=><option key={dr.id} value={dr.id}>{dr.name}</option>)}</select>
                          </div>}
                      </div>);
                  })}
                </div>}
            </div>);
        })}
      </div>
    </div>
  );
}

function App() {
  const [phase,setPhase]=useState(db ? 'loading' : 'ready'); // no db -> offline demo fallback
  const [err,setErr]=useState('');
  const [view,setView]=useState('picker');
  const [user,setUser]=useState(null);
  const userRef = useRef(null); userRef.current = user;
  const actor = () => (userRef.current && userRef.current.name) || 'Someone';
  const [jobs,setJobsState]=useState(INITIAL_JOBS);
  const [orders,setOrdersState]=useState(INITIAL_ORDERS);
  const [rates,setRatesState]=useState(INITIAL_RATES);
  const [drivers,setDriversState]=useState(DRIVERS);
  const [audit,setAudit]=useState([]);
  const [customers,setCustomersState]=useState(CUSTOMERS);
  const [saveError,setSaveError]=useState('');

  useEffect(()=>{ if(!db) return;
    loadAll().then(d=>{ setCustomersState(d.customers); setDriversState(d.drivers); setJobsState(d.jobs); setOrdersState(d.orders); setRatesState(d.rates); setAudit(d.audit); setPhase('ready');
        const missing = d.customers.filter(c=>c.addr && c.lat==null);  // fill in map coordinates for any that lack them
        if(missing.length) backfillCoords(missing, (id,pt)=>{ CUSTOMERS = CUSTOMERS.map(x=>x.id===id?{...x,...pt}:x); setCustomersState(CUSTOMERS);
          if(db) db.from('customers').update({lat:pt.lat,lng:pt.lng}).eq('id',id).then(logErr('backfill coords')); }); })
      .catch(e=>{ console.error(e); setErr(e.message||String(e)); setPhase('error'); });
  },[]);
  useEffect(()=>{ onSaveError=(m)=>setSaveError(m); return ()=>{ onSaveError=null; }; },[]);

  // write-through setters: update the screen AND save to the database
  const setJobs=useCallback(u=>setJobsState(prev=>{ const next=typeof u==='function'?u(prev):u; saveJobs(next); return next; }),[]);
  const setRates=useCallback(u=>setRatesState(prev=>{ const next=typeof u==='function'?u(prev):u; saveRates(next); return next; }),[]);
  const setDrivers=useCallback(u=>setDriversState(prev=>{ const next=typeof u==='function'?u(prev):u; DRIVERS=next; saveDrivers(next); return next; }),[]);
  const deleteDriver=useCallback((id)=>{ setDriversState(prev=>{ const d=prev.find(x=>x.id===id); const next=prev.filter(x=>x.id!==id); DRIVERS=next;
    if(db) db.from('drivers').delete().eq('id',id).then(r=>{ if(r&&r.error) reportErr('delete staff', r.error); });
    if(d) addAudit(`${actor()} removed staff member ${d.name}`); return next; }); },[]);
  const addAudit=useCallback(text=>{ const e={time:now(),text}; setAudit(prev=>[e,...prev]); insertAudit(e); },[]);
  const addOrder=useCallback(o=>{ setOrdersState(prev=>[o,...prev]); saveOrder(o); },[]);
  const updateOrder=useCallback((id,patch)=>setOrdersState(prev=>{ const next=prev.map(o=>o.id===id?{...o,...patch}:o);
    const upd=next.find(o=>o.id===id); if(upd) saveOrder(upd); return next; }),[]);
  const reseqDriver=(arr,did)=>{ const mine=arr.filter(j=>j.driverId===did).sort((a,b)=>a.seq-b.seq).map((j,i)=>({...j,seq:i+1}));
    if(db) mine.forEach(j=>db.from('jobs').upsert(toJobRow(j)).then(logErr('reseq'))); return [...arr.filter(j=>j.driverId!==did),...mine]; };
  const deleteJob=useCallback(job=>{
    setJobsState(prev=>{ const rest=prev.filter(j=>j.id!==job.id);
      if(db) db.from('jobs').delete().eq('id',job.id).then(logErr('deleteJob'));
      return reseqDriver(rest, job.driverId); });
    // cancelling a booking that was never collected removes its pending order too
    if(job.orderId) setOrdersState(prev=>{ const o=prev.find(x=>x.id===job.orderId);
      if(o && o.status==='Pending Collection'){ if(db) db.from('orders').delete().eq('id',job.orderId).then(logErr('cancelOrder')); return prev.filter(x=>x.id!==job.orderId); }
      return prev; });
    addAudit(`${actor()} cancelled a ${job.type} for ${fullName(custById(job.customerId))}`);
  },[]);
  const addCustomer=useCallback((cust)=>{
    const c = { id:uuid(), lat:null, lng:null, ...cust };  // cust already carries lat/lng from the validated postcode
    CUSTOMERS = [...CUSTOMERS, c];              // keep module array in sync (custById reads it)
    setCustomersState(CUSTOMERS);
    if(db) db.from('customers').insert(toCustomerRow(c)).then(r=>{ if(r&&r.error) reportErr('save customer', r.error); });
    if(c.addr && c.lat==null) geocode(c.addr).then(pt=>{ if(pt){ // only if coordinates weren't provided
      CUSTOMERS = CUSTOMERS.map(x=>x.id===c.id?{...x,...pt}:x); setCustomersState(CUSTOMERS);
      if(db) db.from('customers').update({lat:pt.lat,lng:pt.lng}).eq('id',c.id).then(logErr('geocode'));
    }});
    return c;
  },[]);
  const updateCustomer=useCallback((cust)=>{
    CUSTOMERS = CUSTOMERS.map(x=>x.id===cust.id?{...x,...cust}:x);
    setCustomersState(CUSTOMERS);
    if(db) db.from('customers').update(toCustomerRow(cust)).eq('id',cust.id).then(r=>{ if(r&&r.error) reportErr('update customer', r.error); });
    addAudit(`${actor()} updated ${fullName(cust)}'s details`);
  },[]);
  const deleteCustomer=useCallback((id)=>{
    const c = CUSTOMERS.find(x=>x.id===id);
    CUSTOMERS = CUSTOMERS.filter(x=>x.id!==id);
    setCustomersState(CUSTOMERS);
    if(db) db.from('customers').delete().eq('id',id).then(r=>{ if(r&&r.error) reportErr('delete customer', r.error); });
    if(c) addAudit(`${actor()} deleted customer ${fullName(c)}`);
  },[]);
  const dispatchDelivery=useCallback((order, driverId, window)=>{
    const nj={ id:uuid(), driverId, type:'delivery', customerId:order.customerId, orderId:order.id, window, status:'pending',
      packaging:order.packaging, bags:order.bagsCount, weight:order.weight, amount:order.amount,
      service:(order.services||[]).join(', ')||'—', paymentMethod:order.paymentMethod, paidInAdvance:order.paidInAdvance };
    setJobsState(prev=>{ const n=prev.filter(x=>x.driverId===driverId).length; const job={...nj,seq:n+1};
      if(db) db.from('jobs').insert(toJobRow(job)).then(r=>{ if(r&&r.error) reportErr('dispatch job', r.error); });
      return [...prev, job]; });
    updateOrder(order.id, { status:'Out for delivery' });
    addAudit(`${actor()} sent ${fullName(custById(order.customerId))}'s order out for delivery`);
  },[updateOrder,addAudit]);
  const deleteOrder=useCallback(orderId=>{
    setOrdersState(prev=>{ const o=prev.find(x=>x.id===orderId); if(o) addAudit(`${actor()} deleted ${fullName(custById(o.customerId))}'s order`); return prev.filter(x=>x.id!==orderId); });
    if(db) db.from('orders').delete().eq('id',orderId).then(logErr('deleteOrder'));
    // also remove any still-pending collection job linked to this order
    setJobsState(prev=>{ const linked=prev.filter(j=>j.orderId===orderId && j.status==='pending');
      if(!linked.length) return prev; const ids=new Set(linked.map(j=>j.id));
      if(db) linked.forEach(j=>db.from('jobs').delete().eq('id',j.id).then(logErr('deleteLinkedJob')));
      let next=prev.filter(j=>!ids.has(j.id));
      [...new Set(linked.map(j=>j.driverId))].forEach(did=>{ next=reseqDriver(next,did); });
      return next; });
  },[]);
  const addJob=useCallback(j=>{
    const isCol = j.type==='collection';
    const orderId = isCol ? uuid() : null;
    const order = isCol ? { id:orderId, customerId:j.customerId, services:[], extras:[], needsPricing:false, addedItems:{}, firstOrder:false,
      bagsCount:0, bagWeights:[], weight:0, weightCharge:0, amount:0, initialAmount:0,
      packaging:j.packaging, paymentMethod:'—', paidInAdvance:j.paidInAdvance, collectedDate:null, collectedAt:null,
      dueDate:j.returnDate||addDays(TODAY,2), status:'Pending Collection', notes:j.instructions } : null;
    if (order) setOrdersState(prev=>[order,...prev]);
    setJobsState(prev=>{
      const n=prev.filter(x=>x.driverId===j.driverId).length;
      const nj={...j, ...(orderId?{orderId}:null), seq:n+1};
      // persist: order first (if any), THEN the job — awaited so the order exists before the job's FK
      (async()=>{
        if(!db) return;
        try {
          if (order){ const o=await db.from('orders').insert(toOrderRow(order)); if(o.error){ reportErr('save booking', o.error); return; } }
          const r=await db.from('jobs').insert(toJobRow(nj)); if(r.error) reportErr('save job', r.error);
        } catch(e){ reportErr('save job', e); }
      })();
      return [...prev, nj];
    });
  },[]);
  const go=useCallback(v=>{ if(v==='logout'){ setUser(null); setView('picker'); return; } setView(v); },[]);
  const onLogin=(s)=>{ setUser(s); const allowed=PORTALS.filter(p=>hasRole(s,p.role)); setView(allowed.length===1?allowed[0].view:'picker'); };

  let screen=null;
  if (phase==='loading') screen=<LoadingScreen/>;
  else if (phase==='error') screen=<ErrorScreen msg={err}/>;
  else if (!user)                 screen=<StaffLogin staff={drivers} onLogin={onLogin}/>;
  else if (view==='driver-app' && hasRole(user,'driver')) screen=<DriverApp driver={user} go={go} jobs={jobs} setJobs={setJobs} rates={rates} addAudit={addAudit} addOrder={addOrder} updateOrder={updateOrder}/>;
  else if (view==='store-app' && hasRole(user,'store'))   screen=<StoreApp go={go} orders={orders} rates={rates} updateOrder={updateOrder} addAudit={addAudit} deleteOrder={deleteOrder} jobs={jobs} drivers={drivers} onDispatch={dispatchDelivery} user={user}/>;
  else if (view==='admin-app' && hasRole(user,'admin'))   screen=<AdminApp go={go} jobs={jobs} setJobs={setJobs} rates={rates} setRates={setRates} audit={audit} drivers={drivers} setDrivers={setDrivers} deleteDriver={deleteDriver} orders={orders} addJob={addJob} updateOrder={updateOrder} addAudit={addAudit} deleteJob={deleteJob} deleteOrder={deleteOrder} dispatchDelivery={dispatchDelivery} customers={customers} addCustomer={addCustomer} updateCustomer={updateCustomer} deleteCustomer={deleteCustomer} user={user}/>;
  else                            screen=<PortalPicker user={user} onPick={v=>setView(v)} onLogout={()=>go('logout')}/>;
  return <>
    {saveError && <div className="fixed top-0 inset-x-0 z-[60] bg-rose-600 text-white text-sm px-4 py-2.5 flex items-center justify-between gap-3 shadow-lg">
      <span className="inline-flex items-start gap-2"><Ic name="alert" size={16} className="mt-0.5 shrink-0"/><span>{saveError}</span></span>
      <button onClick={()=>setSaveError('')} className="shrink-0 opacity-90 hover:opacity-100"><Ic name="close" size={18}/></button>
    </div>}
    {screen}
  </>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
